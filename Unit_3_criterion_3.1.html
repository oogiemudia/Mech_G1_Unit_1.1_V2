<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16335B">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="3.1 games">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Unit 3, criterion 3.1 games</title>
<style>
:root{--navy:#16335B;--navy2:#22497D;--amber:#E8A33D;--amb:#96610F;--green:#0B6E4F;--red:#B3261E;
--ink:#1F2F4D;--head:#16335B;--muted:#5A6472;--line:#D8E2EE;--bg:#F4F7FB;--card:#FFFFFF;--tint:#EEF3FA;
--goodbg:#E7F4EE;--badbg:#FBEAEA;--ambbg:#FFF6E5;--btn:#16335B;--btnh:#22497D;--art:#16335B;--r:14px;--scale:1;
--shadow:0 1px 2px rgba(22,51,91,.06),0 3px 10px rgba(22,51,91,.05)}
[data-theme="cream"]{--bg:#F6EFE1;--card:#FFFDF8;--line:#E4D9C4;--tint:#F2EADB;--ambbg:#FBEFD6}
[data-theme="dark"]{--bg:#0E1A2B;--card:#16263D;--ink:#E4ECF7;--head:#D3E3F8;--muted:#A6B4C7;--line:#2B3F5E;--tint:#1C3050;
--goodbg:#123A2D;--badbg:#401E1E;--ambbg:#3A2E14;--btn:#2F5E9C;--btnh:#3A6DB0;--art:#BFD4F2;--green:#63D3A8;--red:#FF8F86;--amb:#F2C879;
--shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0E1A2B;--card:#16263D;--ink:#E4ECF7;--head:#D3E3F8;--muted:#A6B4C7;--line:#2B3F5E;--tint:#1C3050;
--goodbg:#123A2D;--badbg:#401E1E;--ambbg:#3A2E14;--btn:#2F5E9C;--btnh:#3A6DB0;--art:#BFD4F2;--green:#63D3A8;--red:#FF8F86;--amb:#F2C879;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:Arial,"Liberation Sans",Helvetica,sans-serif;
font-size:calc(17px * var(--scale));line-height:1.5;-webkit-tap-highlight-color:transparent}
[data-theme="cream"] body{letter-spacing:.01em;word-spacing:.06em;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.86em}
h2,h3{color:var(--head);line-height:1.25}

/* header: full on the menu, compact while playing */
.hdr{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;
padding:calc(18px + env(safe-area-inset-top)) 18px 16px}
.hdr .kick{color:var(--amber);font-weight:700;font-size:.8em}
.hdr h1{margin:3px 0 2px;font-size:1.5em;line-height:1.2}
.hdr .sub{color:#C3D3EA;font-size:.86em}
.rule{height:4px;background:var(--amber)}
.hdr.compact{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.hdr.compact .t{flex:1;min-width:0;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr.compact .n{font-size:.86em;color:#C3D3EA;white-space:nowrap;padding-right:6px}
.iconbtn{flex:none;width:46px;height:46px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;
display:inline-flex;align-items:center;justify-content:center}
.iconbtn.plain{background:var(--tint);color:var(--head)}
.pbar{height:6px;background:var(--line)} .pbar i{display:block;height:100%;background:var(--amber);transition:width .35s}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
body.playing .wrap{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:24px 2px 10px}
.sec h2{margin:0;font-size:1.1em}
.panel{border-radius:var(--r);padding:14px 16px;background:var(--card);border:1px solid var(--line)}
.panel.amber{background:var(--ambbg);border-color:transparent;border-left:5px solid var(--amber)}
.panel h3{margin:0 0 4px;font-size:1em}
.panel p{margin:.35em 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;
border:2px solid var(--btn);background:var(--btn);color:#fff;font-weight:700;text-decoration:none;text-align:center;line-height:1.2}
.btn:hover{background:var(--btnh);border-color:var(--btnh)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#241802}
.btn.amber:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--head);border-color:var(--line)}
.btn.ghost:hover{background:var(--tint)}
.btn.small{min-height:42px;padding:0 14px;font-size:.9em}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 150px}
.link{background:none;border:0;padding:10px 4px;color:var(--head);text-decoration:underline;text-underline-offset:3px;font-weight:700;min-height:44px}
.dock{position:sticky;bottom:0;padding:14px 0 calc(10px + env(safe-area-inset-bottom));margin-top:8px;
background:linear-gradient(to top,var(--bg) 72%,rgba(0,0,0,0));z-index:5}

/* me strip */
.me{display:flex;gap:14px;align-items:center}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:1.05em;
display:flex;align-items:center;justify-content:center;border:3px solid var(--amber)}
.me h2{margin:0;font-size:1.2em}
.me .lvl{color:var(--muted);font-size:.88em}
.meter{height:10px;border-radius:999px;background:var(--tint);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--amber);border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--tint);font-size:.84em;color:var(--head);font-weight:700}
.chip svg.i{width:18px;height:18px}

/* game tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);
border-radius:var(--r);overflow:hidden;padding:0;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--amber)}
.tile:active{transform:scale(.98)}
.tile .art{height:80px;background:var(--tint);display:flex;align-items:center;justify-content:center}
.tile .art svg{width:128px;height:64px}
.tile .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.tile .ttl{font-weight:700;color:var(--head);line-height:1.25}
.tile .what{font-size:.82em;color:var(--muted);line-height:1.35}
.tile .rec{margin-top:auto;padding-top:8px;font-size:.8em;color:var(--muted)}
.tile .rec.good{color:var(--green);font-weight:700}
.badge{align-self:flex-start;margin-bottom:3px;background:var(--amber);color:#241802;font-weight:700;font-size:.72em;padding:3px 9px;border-radius:999px}
.tick{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}
.tick svg.i{width:18px;height:18px;stroke-width:3}
.rows{display:flex;flex-direction:column;gap:10px}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
border-radius:var(--r);padding:12px 14px;min-height:66px;box-shadow:var(--shadow)}
.rowbtn:hover{border-color:var(--amber)}
.rowbtn .ic{flex:none;width:42px;height:42px;border-radius:11px;background:var(--tint);color:var(--head);display:flex;align-items:center;justify-content:center}
.rowbtn .tx{flex:1;min-width:0}
.rowbtn .tx b{color:var(--head);display:block}
.rowbtn .tx span{display:block;color:var(--muted);font-size:.84em;line-height:1.35}
.pill{flex:none;font-size:.76em;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--goodbg);color:var(--green)}
.pill.amber{background:var(--ambbg);color:var(--amb)}
.foot{margin:28px 4px 0;color:var(--muted);font-size:.8em;line-height:1.5}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.76em;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--head);font-weight:700}
.tabbar button[aria-current="page"] svg.i{color:var(--amber);stroke-width:2.4}
body.playing .tabbar, body.out .tabbar{display:none}

/* questions */
.qno{color:var(--amb);font-weight:700;font-size:.86em}
.qtext{font-size:1.2em;font-weight:700;color:var(--head);line-height:1.35;margin:4px 0 6px}
.qprompt{color:var(--muted);margin:8px 0 12px}
.qart{background:var(--tint);border-radius:12px;padding:10px;margin:12px 0;display:flex;justify-content:center}
.qart svg{width:100%;max-width:340px;height:auto}
.stepnote{background:var(--goodbg);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.9em}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 12px;border-radius:12px;
border:2px solid var(--line);background:var(--card);text-align:left;line-height:1.35}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;background:var(--tint);color:var(--head);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.88em}
.opt .l{flex:1;min-width:0}
.opt .s{flex:none;font-size:.76em;font-weight:700;text-align:right;max-width:5.5em;line-height:1.2}
.opt:not(:disabled):hover{border-color:var(--amber)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--green);background:var(--goodbg)} .opt.correct .s{color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--badbg)} .opt.wrong .s{color:var(--red)}
.opt.dim{opacity:.6}
.opts.two .opt .s{display:none}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;border-left:5px solid var(--green);background:var(--goodbg)}
.fb.bad{border-left-color:var(--red);background:var(--badbg)}
.fb.info{border-left-color:var(--amber);background:var(--ambbg)}
.fb strong{display:block;margin-bottom:2px}
.fb ol{margin:.4em 0 0 1.2em;padding:0}

/* spot the error */
.chunks{display:flex;flex-wrap:wrap;gap:8px}
.chunk{padding:10px 12px;border:2px dashed var(--line);border-radius:10px;background:var(--card);text-align:left;min-height:48px;line-height:1.35}
.chunk:not(:disabled):hover{border-color:var(--amber)}
.chunk.is-error{border:2px solid var(--red);background:var(--badbg)}
.chunk.wrong-pick{border:2px solid var(--amber);background:var(--ambbg)}
.chunk.fine{opacity:.55}
.chunk:disabled{cursor:default}

/* brief or spec swipe */
.deck{position:relative;height:230px;margin:6px 0 16px;touch-action:pan-y;overflow:hidden;border-radius:20px}
.scard{position:absolute;inset:4px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
border-radius:18px;background:var(--card);border:2px solid var(--head);font-size:1.12em;font-weight:700;color:var(--head);
box-shadow:0 8px 24px rgba(22,51,91,.12);transition:transform .25s,opacity .25s;user-select:none}
.scard.back{transform:translateY(10px) scale(.96);opacity:.5;color:transparent;border-color:var(--line)}
.scard .hint{position:absolute;top:12px;font-size:.72em;padding:3px 10px;border-radius:999px;opacity:0;font-weight:700}
.scard .hint.l{left:12px;background:var(--tint);color:var(--head)}
.scard .hint.r{right:12px;background:var(--amber);color:#241802}

/* sequence */
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip2{min-height:46px;padding:8px 12px;border-radius:10px;border:2px solid var(--head);background:var(--card);color:var(--head);font-weight:700;text-align:left}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;min-height:50px;border:2px dashed var(--line);border-radius:10px;padding:6px 10px;background:var(--card);text-align:left;width:100%}
.slot b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--head);display:flex;align-items:center;justify-content:center;font-size:.85em}
.slot.filled{border-style:solid;border-color:var(--head)}
.slot.ok{border-color:var(--green);background:var(--goodbg)} .slot.no{border-color:var(--red);background:var(--badbg)}

/* ladder */
.rungs{display:flex;gap:5px;margin:0 0 12px}
.rungs i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.rungs i.done{background:var(--green)} .rungs i.miss{background:var(--red)} .rungs i.now{background:var(--amber)}
.numrow{display:flex;gap:10px;align-items:center}
.textin{width:100%;min-height:52px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:1.05em}
.textin:focus{border-color:var(--amber);outline:none}
.numrow .textin{flex:1;font-size:1.2em;font-weight:700}
.unit{font-weight:700;color:var(--head)}
.worked{background:var(--tint);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.92em}
.worked ol{margin:.3em 0 0 1.2em;padding:0}

/* flash cards */
.flip{display:block;perspective:1200px;width:100%;border:0;background:none;padding:0;margin:4px 0 14px}
.flip .inner{display:block;position:relative;height:250px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
.face.front{background:var(--card);border:2px solid var(--head)}
.face.front strong{font-size:1.45em;color:var(--head);line-height:1.25}
.face.back{background:var(--navy);color:#fff;transform:rotateY(180deg);font-size:1.02em;line-height:1.45}
.face.back .muted{color:#C3D3EA}

/* results */
.result{text-align:center;padding:22px 16px}
.big{font-size:3.2em;font-weight:700;color:var(--head);line-height:1.1}
.big small{font-size:.38em;color:var(--muted);font-weight:700}
.seal{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 14px;border-radius:999px;background:var(--goodbg);color:var(--green);font-weight:700}
.seal.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.code{display:inline-block;font-weight:700;letter-spacing:.08em;background:var(--card);border:2px solid var(--amber);border-radius:8px;padding:4px 10px;color:var(--head)}
.review{margin:0;padding-left:1.1em} .review li{margin:.55em 0}
.copyline{width:100%;min-height:90px;font-size:.84em;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--tint)}

/* record */
.recard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.recard b{color:var(--head)} .recard .meta{grid-column:1/2;color:var(--muted);font-size:.84em}
.recard .act{grid-row:1/3;grid-column:2/3}

/* check-ins and exit ticket */
.q{margin:18px 0}
.q > p, .q > label, .q legend{display:block;font-weight:700;color:var(--head);margin-bottom:8px}
fieldset.q{border:0;padding:0;margin-left:0;margin-right:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:10px;margin:6px 0;background:var(--card);min-height:48px;font-weight:400;color:var(--ink)}
.check input{width:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--navy)}
textarea.textin{min-height:96px;resize:vertical}
.rag{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rag button{min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9em}
.rag button[aria-pressed="true"].r{background:var(--badbg);border-color:var(--red);color:var(--red)}
.rag button[aria-pressed="true"].a{background:var(--ambbg);border-color:var(--amber);color:var(--amb)}
.rag button[aria-pressed="true"].g{background:var(--goodbg);border-color:var(--green);color:var(--green)}

/* sign in */
.card label[for="code"]{display:block}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.names button{min-height:50px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;color:var(--head);text-align:left;padding:8px 12px}
.names button:hover{border-color:var(--amber)}
.codebox{display:block;margin:6px auto 0;text-transform:uppercase;letter-spacing:.3em;font-size:1.5em;font-weight:700;text-align:center;max-width:260px}

/* settings */
.seg{display:grid;gap:6px;margin:6px 0 14px}
.seg button{min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9em}
.seg button[aria-pressed="true"]{border-color:var(--head);background:var(--tint);color:var(--head)}
details.tut{margin-top:12px}
details.tut summary{cursor:pointer;font-weight:700;color:var(--head);min-height:48px;display:flex;align-items:center}
.tut table{width:100%;border-collapse:collapse;font-size:.86em;margin:8px 0}
.tut td,.tut th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}

/* data card */
.modal{position:fixed;inset:0;background:rgba(14,26,43,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:18px}}
.dtable{width:100%;border-collapse:collapse;font-size:.92em;font-variant-numeric:tabular-nums}
.dtable th,.dtable td{border:1px solid var(--line);padding:8px;text-align:right}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.dtable thead th{background:var(--tint);color:var(--head)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;
padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;font-size:.9em}

/* tile and question art */
.a-i{fill:none;stroke:var(--art);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.a-a{fill:none;stroke:var(--amber);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.a-f{fill:var(--card);stroke:var(--art);stroke-width:2.2;stroke-linejoin:round}
.a-fa{fill:var(--amber);stroke:none}
.a-fi{fill:var(--art);stroke:none}
.a-d{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:6 5}
.a-t{fill:var(--art);font:700 13px Arial,sans-serif}


/* activating hard thinking layer (from the criterion 8.1 (continued) and 10.1 reference hub) */
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:3px}
.badges:empty{display:none}
.badge{margin-bottom:0}
.badge.next{background:var(--green);color:#fff}
.step{align-self:flex-start;background:var(--tint);color:var(--head);font-weight:700;font-size:.72em;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.part{margin-top:6px}
.part .sec{align-items:center}
.part .sec h2{font-size:1.05em}
details.goals{margin:-4px 2px 10px}
details.goals summary{cursor:pointer;color:var(--head);font-weight:700;font-size:.88em;min-height:44px;display:flex;align-items:center}
details.goals ul{margin:0 0 4px;padding-left:1.2em;font-size:.9em}
.modebox{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.goal .btn.small{flex:1 1 120px}
.pill.red{background:var(--badbg);color:var(--red)}
.opt.picked{border-color:var(--amber);background:var(--ambbg)}
.rag.conf button{min-height:50px}
.rag button[aria-pressed="true"].g{background:var(--goodbg);border-color:var(--green);color:var(--green)}
.whyno{display:block;margin:6px 0;padding:6px 10px;border-radius:8px;background:var(--card);border:1px dashed var(--red)}
.nextstep{margin-top:12px;border-left:5px solid var(--green)}
.calgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calgrid div{background:var(--tint);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.calgrid div.warn{background:var(--badbg)}
.calgrid b{font-size:1.5em;color:var(--head);line-height:1.1}
.calgrid div.warn b{color:var(--red)}
.calgrid span{font-size:.84em;color:var(--muted)}
.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcol{display:flex;flex-direction:column;gap:8px}
.pb{min-height:56px;padding:8px 10px;border-radius:10px;border:2px solid var(--head);background:var(--card);color:var(--head);font-weight:700;text-align:left;line-height:1.3;font-size:.92em}
.pb.r{font-weight:400;color:var(--ink);border-color:var(--line)}
.pb.sel{border-color:var(--amber);background:var(--ambbg)}
.pb.ok{border-color:var(--green);background:var(--goodbg);color:var(--green);cursor:default}
.pb.no{border-color:var(--red);background:var(--badbg)}
.ftable td{text-align:left}

@media (min-width:900px){.wrap{max-width:980px}.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[data-motion="reduce"] *{transition:none!important;animation:none!important}
/* retrieval layer and the criterion 3.1 games */
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px}
.tag{font-size:.72em;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--head);border:1px solid var(--line);line-height:1.5}
.tag.sl{background:var(--ambbg);border-color:transparent;color:var(--amb)}
.tile .tags{margin:4px 0 0}
.flabel{font-size:.8em;color:var(--muted);font-weight:700;margin:10px 2px 4px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.filters button{min-height:44px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--head);font-weight:700;font-size:.84em}
.filters button[aria-pressed="true"]{border-color:var(--head);background:var(--tint)}
.microw{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.mic.on{background:var(--ambbg);border-color:var(--amber);color:var(--head)}
.micnote{margin:6px 0 0}
.cue{font-size:1.15em;font-weight:700;color:var(--amb);margin:2px 0 10px;line-height:1.7}
.cue .cw{display:inline-block;white-space:nowrap;margin-right:.8em}
.ideas{margin:8px 0 0;padding:0;list-style:none}
.ideas li{display:flex;gap:8px;align-items:flex-start;margin:6px 0;line-height:1.35}
.ideas li b{flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85em;color:#fff;margin-top:1px}
.ideas li b svg.i{width:16px;height:16px;stroke-width:3}
.ideas li.y b{background:var(--green)} .ideas li.n b{background:var(--amb)}
.model{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.selfmark{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.selfmark.two{grid-template-columns:1fr 1fr}
.selfmark button{min-height:54px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.92em;color:var(--head);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:4px}
.selfmark button .small{font-weight:400;color:var(--muted);font-size:.75em}
.selfmark button.sug{border-style:dashed;border-color:var(--amber)}
.selfmark button[aria-pressed="true"].got{background:var(--goodbg);border-color:var(--green);color:var(--green)}
.selfmark button[aria-pressed="true"].part{background:var(--ambbg);border-color:var(--amber);color:var(--amb)}
.selfmark button[aria-pressed="true"].miss{background:var(--badbg);border-color:var(--red);color:var(--red)}
.bins{display:grid;grid-template-columns:1fr;gap:10px;margin-top:6px}
@media (min-width:560px){.bins{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
.bins.grid2{grid-template-columns:repeat(auto-fit,minmax(min(100%,8em),1fr))}
.bin{border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px;min-height:80px;min-width:0}
.binhead{overflow-wrap:break-word;min-height:46px;border:0;border-radius:8px;background:var(--tint);color:var(--head);font-weight:700;text-align:left;padding:6px 10px;line-height:1.25}
.binhead:not(:disabled):hover{outline:2px solid var(--amber)}
.placed{min-height:44px;border-radius:8px;border:2px solid var(--head);background:var(--card);color:var(--ink);text-align:left;padding:6px 10px;font-size:.9em;line-height:1.3;overflow-wrap:anywhere}
.placed.ok{border-color:var(--green);background:var(--goodbg)} .placed.no{border-color:var(--red);background:var(--badbg)}
.chip2{overflow-wrap:anywhere}
.chip2.sel{border-color:var(--amber);background:var(--ambbg)}
.timer{display:inline-block;margin:2px 0 10px;padding:4px 12px;border-radius:999px;background:var(--tint);color:var(--head);font-size:.9em}
.timer b{font-size:1.15em}
.timer.up{background:var(--ambbg);color:var(--amb)}
.ban{display:inline-block;margin:2px 2px;padding:1px 8px;border-radius:6px;background:var(--badbg);color:var(--red)}
.fambtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fambtns .btn{min-height:50px}
.fambtns .btn.rightans{border-color:var(--green);background:var(--goodbg);color:var(--green);opacity:1}
.fambtns .btn.wrongans{border-color:var(--red);background:var(--badbg);color:var(--red);opacity:1}
.flip[disabled]{cursor:default}
.flip[disabled] .face.front{border-style:dashed}
.scard span{font-size:1em}

</style>

var CONTENT = {"parts":[{"id":"p0","title":"Warm up","sub":"Wake up what you need from earlier units, and from last lesson.","goals":["Recall the earlier learning this criterion builds on","Answer last lesson's questions from memory","Write down everything you can remember about a part"],"games":["recall","last","dump"]},{"id":"p1","title":"Part 1: Drawing types (1): sketches, pictorial and orthographic","sub":"Lesson slides 8 to 41. Sketches, isometric, first and third angle, CAD models.","goals":["Describe a freehand sketch, an isometric drawing and an orthographic drawing, and who each is for","Tell first angle from third angle by the layout and by the symbol","Put the steps for drawing in third angle in order"],"games":["projection","order"]},{"id":"p2","title":"Part 2: Drawing types (2): inside, assembled and as a system","sub":"Lesson slides 42 to 74. Sections, assemblies, diagrams and schematics.","goals":["Choose the right drawing for a job and say why","Apply the section and hatching rules","Tell pneumatic from hydraulic, and a circuit diagram from a wiring diagram","Name the circuit and fluid power symbols"],"games":["choose","swipe","symbols"]},{"id":"p3","title":"Part 3: Reading a drawing (1): title block, scale, views and lines","sub":"Lesson slides 75 to 96. What the sheet tells you before you look at the part.","goals":["Read a title block and say why the revision letter matters","Work out drawing and real sizes from a scale, and find a scale","Name every type of line and what it shows"],"games":["scale","lines"]},{"id":"p4","title":"Part 4: Reading a drawing (2): finish, features, symbols and CAD","sub":"Lesson slides 97 to 132. Surface finish, threads, holes, abbreviations and CAD.","goals":["Read surface finish symbols and Ra values","Read thread, hole and PCD notes","Give the meaning of every abbreviation in the specification","Explain what CAD is used for, with its strengths and drawbacks"],"games":["abbr","notes","featsort"]},{"id":"mix","title":"Pull it together","sub":"Lesson slides 133 to 138. Every part, mixed.","goals":["Work through scale calculations with less and less help","Define every key word from memory","Explain, compare and mark exam answers"],"games":["ladder","term","taboo","why","errors","examiner","boss"]}],"goals":[{"t":"Describe the characteristics, purpose and audience of each drawing type","games":["choose","swipe","examiner"]},{"t":"Choose the right drawing for a job, and justify the choice","games":["choose","why","taboo"]},{"t":"Explain first and third angle projection and recognise each symbol","games":["projection","order","errors"]},{"t":"Apply the section, hatching and schematic conventions","games":["swipe","symbols","why"]},{"t":"Read a title block and explain why the revision letter matters","games":["lines","why","boss"]},{"t":"Use a scale both ways, and find the scale of a drawing","games":["scale","ladder"]},{"t":"Name every type of line and say what it shows","games":["lines","errors","term"]},{"t":"Interpret surface finish, threads, holes, abbreviations and symbols","games":["abbr","notes","featsort"]},{"t":"Explain the purpose and applications of CAD, with its strengths and drawbacks","games":["featsort","examiner","why"]}],"recall":[{"id":"R01","q":"What is a design specification?","opts":["A list of measurable requirements the design must meet","A quick sketch of an idea","The drawing of the finished part","The price list for a product"],"why":"A specification sets out measurable requirements (criterion 1.1). The drawings then show how the design meets them.","fb":{"A quick sketch of an idea":"That is a concept sketch. A specification is a list of measurable requirements."},"a":9},{"id":"R02","q":"What does the ratio 1:4 mean?","opts":["The second amount is four times the first","The first amount is four times the second","Add 4 to the first amount","The two amounts are the same"],"why":"For every 1 of the first there are 4 of the second (criterion 4.1). A 1:4 scale drawing is a quarter of the real size.","fb":{"The first amount is four times the second":"That is 4:1. The order matters, and on a scale the first number is the drawing."},"a":9},{"id":"R03","q":"Write 25:100 in its simplest form.","opts":["1:4","4:1","5:10","1:25"],"why":"Divide both sides by 25 (criterion 4.1). The same step finds the scale of a drawing.","fb":{"4:1":"The order has flipped. 25 is the smaller amount, so it becomes the 1."},"a":9,"t":{"k":"ratio","v":0.25}},{"id":"R04","q":"A part is 1.2 m long. How long is it in millimetres?","opts":["1200 mm","120 mm","12 mm","12 000 mm"],"why":"1 m = 1000 mm, so 1.2 × 1000 = 1200 mm. Drawings give every size in millimetres.","fb":{"120 mm":"That multiplies by 100. There are 1000 mm in a metre."},"t":{"k":"num","v":1200,"unit":"mm","tol":0.001}},{"id":"R05","q":"What does CNC stand for?","opts":["Computer numerical control","Computer network control","Central numeric cutting","Controlled numerical cutting"],"why":"A machine tool run by a program (criterion 1.3). In Part 4, CAM turns the CAD model into that program.","t":{"k":"short","acc":["computer numerical control","computer numerically controlled","computerised numerical control","computer numeric control","computer numerical controlled"]}},{"id":"R06","q":"An early working model, built to test a design before it is made in numbers, is called a what?","opts":["Prototype","Specification","Template","Pattern"],"why":"A prototype (criterion 1.1). CAD simulation, in Part 4, can cut how many prototypes are needed.","t":{"k":"short","acc":["prototype","a prototype","prototypes","prototype model"]}},{"id":"R07","q":"Which audience is best shown a freehand sketch in plain language?","opts":["A client with no engineering knowledge","A CNC machinist","A quality inspector","A toolmaker"],"why":"A non-technical audience (criterion 1.1). Technical audiences get formal drawings with exact sizes.","fb":{"A CNC machinist":"A machinist needs exact sizes, so a formal drawing, not a sketch."},"a":9},{"id":"R08","q":"Which component protects a circuit by melting when the current is too high?","opts":["Fuse","Resistor","Diode","Switch"],"why":"A fuse (Unit 8). Its symbol, a rectangle with the wire running through it, comes up in Part 2.","fb":{"Resistor":"A resistor limits current all the time. A fuse breaks the circuit when the current is too high."},"t":{"k":"short","acc":["fuse","a fuse","fuses"]}},{"id":"R09","q":"Which component lets current flow in one direction only?","opts":["Diode","Resistor","Capacitor","Fuse"],"why":"A diode (criterion 8.1). Its symbol is a triangle pointing at a bar, the way current can flow.","t":{"k":"short","acc":["diode","a diode","diodes"]}},{"id":"R10","q":"What is the unit of electrical resistance?","opts":["Ohm","Volt","Amp","Watt"],"why":"The ohm, symbol Ω (Unit 8). Resistor values on circuit diagrams are given in ohms.","t":{"k":"short","acc":["ohm","ohms","the ohm"]}},{"id":"R11","q":"Which actuator uses compressed air to push a piston in a straight line?","opts":["Pneumatic cylinder","Hydraulic motor","Solenoid","Stepper motor"],"why":"A pneumatic cylinder (criterion 10.2). In Part 2 you meet its symbol on a pneumatic schematic.","fb":{"Hydraulic motor":"Hydraulics uses oil, and a motor turns rather than pushing in a line."},"t":{"k":"short","acc":["pneumatic cylinder","air cylinder","pneumatic actuator","pneumatic ram","cylinder"]}},{"id":"R12","q":"Which process cuts metal away by spinning the work against a cutting tool?","opts":["Turning","Casting","Forging","Welding"],"why":"Turning, on a lathe (criterion 1.3). Surface finish symbols in Part 4 tell the turner how smooth to make it.","t":{"k":"short","acc":["turning","lathe","turning on a lathe","lathe work","turned"]}},{"id":"R13","q":"Which process makes a part by pouring molten metal into a mould?","opts":["Casting","Turning","Milling","Pressing"],"why":"Casting (criterion 1.3). A surface left \"as cast\" gets the circle surface finish symbol: do not remove material.","t":{"k":"short","acc":["casting","cast","sand casting","die casting","metal casting"]}},{"id":"R14","q":"What is one fifth of 340?","opts":["68","1700","335","85"],"why":"340 ÷ 5 = 68 (criterion 4.1). Dividing by 5 is exactly what a 1:5 scale asks you to do.","fb":{"1700":"That multiplies by 5. One fifth means divide by 5."},"t":{"k":"num","v":68,"unit":"","tol":0.001}},{"id":"R15","q":"A client's short statement of the problem they want solved is called the design what?","opts":["Brief","Specification","Schedule","Tolerance"],"why":"The design brief (criterion 1.1). The specification comes after, with measurable requirements.","fb":{"Specification":"The specification is the detailed list of requirements written from the brief."},"t":{"k":"short","acc":["brief","design brief","the brief","a brief"]}},{"id":"R16","q":"What colour is the earth wire in UK wiring?","opts":["Green and yellow","Blue","Brown","Black"],"why":"Green and yellow (Unit 8). Brown is live and blue is neutral. Wiring diagrams in Part 2 show these colours.","fb":{"Brown":"Brown is live.","Blue":"Blue is neutral."},"t":{"k":"short","acc":["green and yellow","green yellow","yellow and green","green/yellow","yellow green"]}}],"keywords":[{"id":"K101","term":"Freehand sketch","acc":["freehand sketch","freehand sketches","freehand","free hand sketch","sketch","a sketch"],"part":1,"slide":38,"def":"Drawn by hand without instruments, to get an idea across quickly. Not to scale."},{"id":"K102","term":"Isometric drawing","acc":["isometric drawing","isometric","isometric view","isometric projection"],"part":1,"slide":38,"def":"A 2D drawing showing an object in 3D, with width and depth lines at 30° and the same scale on every axis."},{"id":"K103","term":"Orthographic projection","acc":["orthographic projection","orthographic","orthographic drawing","orthographic views"],"part":1,"slide":38,"def":"Separate 2D views, each looking straight at one face, giving true shapes and sizes."},{"id":"K104","term":"First angle","acc":["first angle","first angle projection","1st angle","first angle orthographic"],"part":1,"slide":38,"def":"Each view is drawn on the opposite side of the front view from the face being looked at."},{"id":"K105","term":"Third angle","acc":["third angle","third angle projection","3rd angle","third angle orthographic"],"part":1,"slide":38,"def":"Each view is drawn on the same side of the front view as the face being looked at."},{"id":"K106","term":"Elevation","acc":["elevation","an elevation","elevations","front elevation"],"part":1,"slide":38,"def":"A view looking horizontally at the front or side of the object."},{"id":"K107","term":"Plan","acc":["plan","the plan","plan view","top view"],"part":1,"slide":38,"def":"The view looking straight down on the object from above."},{"id":"K108","term":"CAD model","acc":["cad model","3d cad model","cad","computer model","3d model","cad models"],"part":1,"slide":38,"def":"A 3D digital model that can be viewed, tested and turned into drawings and machine code."},{"id":"K109","term":"BS 8888","acc":["bs 8888","bs8888","british standard 8888","bs 8888 2025","bs8888 2025"],"part":1,"slide":12,"def":"The UK standard for technical product documentation and specification: the rules for views, lines and dimensions."},{"id":"K110","term":"Projection symbol","acc":["projection symbol","the projection symbol","symbol","projection symbols"],"part":1,"slide":30,"def":"Two circles and a cone, printed by the title block, that show whether a drawing is first or third angle."},{"id":"K201","term":"Section view","acc":["section view","section","sectional view","sectional drawing","cross section","section drawing"],"part":2,"slide":73,"def":"A view of the inside of a part as if it had been cut along a cutting plane."},{"id":"K202","term":"Cutting plane","acc":["cutting plane","cutting plane line","cutting line","section line"],"part":2,"slide":73,"def":"A chain line with arrows and letters showing where a section is taken."},{"id":"K203","term":"Hatching","acc":["hatching","hatch","hatched","cross hatching","section lines"],"part":2,"slide":73,"def":"Thin lines, usually at 45°, showing solid material that the cut went through."},{"id":"K204","term":"Assembly drawing","acc":["assembly drawing","assembly","assembly drawings"],"part":2,"slide":73,"def":"Shows how several parts fit together as one unit, with numbered balloons and a parts list."},{"id":"K205","term":"General arrangement","acc":["general arrangement","ga","general arrangement drawing","ga drawing"],"part":2,"slide":73,"def":"Shows the whole product and where every sub-assembly and part sits, usually at a reduction scale."},{"id":"K206","term":"Exploded view","acc":["exploded view","exploded","exploded drawing","exploded diagram"],"part":2,"slide":73,"def":"Parts pulled apart along the line they go together on, so no part hides behind another."},{"id":"K207","term":"Block diagram","acc":["block diagram","block diagrams"],"part":2,"slide":73,"def":"A system shown as input, process and output boxes joined by arrows."},{"id":"K208","term":"Schematic","acc":["schematic","schematic diagram","schematics"],"part":2,"slide":73,"def":"A diagram using standard symbols to show how a system works, not how it looks."},{"id":"K209","term":"Detail view","acc":["detail view","detail","enlarged view","detail views"],"part":2,"slide":47,"def":"One small area of a drawing shown enlarged, marked with a circle and a letter, at its own scale."},{"id":"K210","term":"Flowchart","acc":["flowchart","flow chart","flowcharts","flow diagram"],"part":2,"slide":56,"def":"The steps of a process in order, using standard shapes joined by arrows."},{"id":"K211","term":"Wiring diagram","acc":["wiring diagram","wiring diagrams","wiring"],"part":2,"slide":60,"def":"Shows where electrical parts really sit, which terminal each wire goes to, and the wire colours."},{"id":"K212","term":"Circuit diagram","acc":["circuit diagram","circuit diagrams","circuit"],"part":2,"slide":59,"def":"Shows how components connect, with BS 3939 symbols and straight lines for the wires."},{"id":"K301","term":"Title block","acc":["title block","title box","title panel"],"part":3,"slide":93,"def":"The panel, usually bottom right, that says what the drawing is, who owns it and its number."},{"id":"K302","term":"Revision","acc":["revision","revision letter","rev","issue","version"],"part":3,"slide":93,"def":"A letter in the title block that moves on each time the drawing is changed, so everyone works from the latest one."},{"id":"K303","term":"Scale","acc":["scale","drawing scale","the scale"],"part":3,"slide":93,"def":"Drawing size compared with real size, written drawing : real."},{"id":"K304","term":"Reduction scale","acc":["reduction scale","reduction","reducing scale","reduced scale"],"part":3,"slide":93,"def":"Drawn smaller than real size, for example 1:5."},{"id":"K305","term":"Enlargement scale","acc":["enlargement scale","enlargement","enlarging scale","enlarged scale"],"part":3,"slide":93,"def":"Drawn larger than real size, for example 5:1."},{"id":"K306","term":"Auxiliary view","acc":["auxiliary view","auxiliary","auxiliary projection","auxiliary views"],"part":3,"slide":93,"def":"A view looking straight at a sloping face to show its true shape."},{"id":"K307","term":"Hidden detail line","acc":["hidden detail line","hidden detail","hidden line","hidden lines","hidden detail lines"],"part":3,"slide":93,"def":"A thin dashed line showing an edge you cannot see from that view."},{"id":"K308","term":"Centre line","acc":["centre line","centre lines","centreline","center line"],"part":3,"slide":93,"def":"A thin chain line through the middle of a hole or the axis of a round part."},{"id":"K309","term":"Leader line","acc":["leader line","leader","leader lines"],"part":3,"slide":86,"def":"A thin line with an arrow or a dot that links a note to the feature it describes."},{"id":"K310","term":"Dimension line","acc":["dimension line","dimension","dimension lines"],"part":3,"slide":86,"def":"A thin line with an arrowhead at each end, showing the length of a size."},{"id":"K401","term":"Ra","acc":["ra","r a","ra value"],"part":4,"slide":130,"def":"The average roughness of a surface in micrometres. Smaller means smoother."},{"id":"K402","term":"Counterbore","acc":["counterbore","counter bore","cbore","counterbored hole"],"part":4,"slide":130,"def":"A flat-bottomed, larger hole so a cap head screw sits below the surface."},{"id":"K403","term":"Countersink","acc":["countersink","counter sink","csk","countersunk","countersunk hole"],"part":4,"slide":130,"def":"A cone-shaped recess so a screw head with a sloping underside sits flush."},{"id":"K404","term":"PCD","acc":["pcd","pitch circle diameter","pitch circle"],"part":4,"slide":130,"def":"The diameter of the circle through the centres of a ring of holes."},{"id":"K405","term":"Across flats","acc":["across flats","af","across the flats","a f"],"part":4,"slide":130,"def":"The distance between opposite flats of a nut or bolt head: the spanner size."},{"id":"K406","term":"Undercut","acc":["undercut","ucut","under cut","undercut groove"],"part":4,"slide":130,"def":"A groove where a thread or a diameter ends, so the tool can run out."},{"id":"K407","term":"CAD","acc":["cad","computer aided design","computer aided drawing"],"part":4,"slide":130,"def":"Using a computer to create, change and test designs."},{"id":"K408","term":"CAM","acc":["cam","computer aided manufacture","computer aided manufacturing"],"part":4,"slide":130,"def":"Using the 3D model to drive machines such as CNC mills and 3D printers."},{"id":"K409","term":"Pitch","acc":["pitch","thread pitch","the pitch"],"part":4,"slide":102,"def":"The distance from one thread crest to the next."},{"id":"K410","term":"Chamfer","acc":["chamfer","cham","chamfered edge","chamfers"],"part":4,"slide":117,"def":"A small angled edge cut where two faces meet, often at 45°."}],"formulas":[["Scale","drawing size : real size"],["Reduction 1:n, real to drawing","drawing size = real size ÷ n"],["Reduction 1:n, drawing to real","real size = drawing size × n"],["Enlargement n:1, real to drawing","drawing size = real size × n"],["Enlargement n:1, drawing to real","real size = drawing size ÷ n"],["Finding the scale","drawing : real, then divide both by the smaller number"],["Metres to millimetres","× 1000"],["Surface finish, Ra","a smaller number means a smoother surface"],["M8 × 1","metric thread, 8 mm major diameter, 1 mm pitch (no pitch written means coarse)"],["4 × Ø8 ON Ø55 PCD","four holes, each 8 mm diameter, centres on a 55 mm circle"]],"formulaNote":"Sizes on drawings are in millimetres. A scale is written as a ratio, for example 1:5, and the first number is always the drawing. Dimensions always give the real size, whatever the scale.","checkin":{"p1":{"title":"Part 1 check-in: sketches, pictorial and orthographic","lines":["Say what a freehand sketch is for, and why a part cannot be made from it.","Describe an isometric drawing: 30°, the same scale on every axis, no perspective.","Explain what an orthographic drawing shows, and name the three usual views.","Tell first angle from third angle by where the plan sits.","Recognise the first and third angle symbols.","Say what a CAD model can produce besides a 3D picture."]},"p2":{"title":"Part 2 check-in: sections, assemblies and system diagrams","lines":["Explain what a section view shows and how hatching works.","Say what an assembly drawing, a GA and an exploded view are each for.","Describe a block diagram and a flowchart, with the flowchart shapes.","Tell a circuit diagram from a wiring diagram.","Tell a pneumatic schematic from a hydraulic one.","Name the common circuit and fluid power symbols."]},"p3":{"title":"Part 3 check-in: title block, scale, views and lines","lines":["List what goes in a title block.","Explain why the revision letter matters.","Use a scale to work out a real size or a drawing size.","Say when an auxiliary view is needed.","Name each type of line and what it shows.","Use the order of priority when two lines fall in the same place."]},"p4":{"title":"Part 4 check-in: finish, features, symbols and CAD","lines":["Read Ra and the three surface finish symbols.","Read a metric thread note and say how threads are drawn.","Read a repeated-hole note with a PCD.","Tell a counterbore from a countersink.","Give the meaning of each abbreviation in the specification.","Explain two applications of CAD and one drawback."]}},"checkinRecall":{"p1":[{"id":"CK11","k":"term","q":"Separate 2D views, each looking straight at one face, giving true shapes and sizes.","acc":["orthographic projection","orthographic","orthographic drawing","orthographic views"],"rivals":["isometric","isometric drawing"],"p":1,"a":24,"why":"Orthographic projection."},{"id":"CK12","k":"short","q":"In third angle projection, where is the plan drawn?","acc":["above the front view","above","above the front elevation","on top of the front view","above it"],"rivals":["below","below the front view","under the front view"],"p":1,"a":28,"why":"Above the front view. In first angle it goes below."}],"p2":[{"id":"CK21","k":"term","q":"Thin lines, usually at 45°, showing solid material that has been cut.","acc":["hatching","hatch","hatched","cross hatching","section lines"],"p":2,"a":46,"why":"Hatching."},{"id":"CK22","k":"short","q":"Which flowchart shape shows a decision?","acc":["diamond","a diamond","rhombus","diamond shape"],"rivals":["oval","rectangle","parallelogram"],"p":2,"a":56,"why":"A diamond, with a yes and a no path out of it."}],"p3":[{"id":"CK31","k":"num","q":"A line is 34 mm long on a 1:5 drawing. What is the real length?","v":170,"unit":"mm","tol":0.001,"p":3,"a":81,"why":"Drawing to real at 1:5: 34 × 5 = 170 mm."},{"id":"CK32","k":"short","q":"Which type of line is thin and dashed?","acc":["hidden detail line","hidden detail","hidden line","hidden lines","hidden edges","hidden"],"rivals":["centre line","chain line"],"p":3,"a":86,"why":"Hidden detail: edges you cannot see from that view."}],"p4":[{"id":"CK41","k":"short","q":"What does the abbreviation CSK mean on a drawing?","acc":["countersink","countersunk","counter sink","counter sunk","countersunk hole"],"rivals":["counterbore","counter bore"],"p":4,"a":113,"why":"Countersink or countersunk."},{"id":"CK42","k":"term","q":"Using the 3D model to drive machines such as CNC mills and 3D printers.","acc":["cam","computer aided manufacture","computer aided manufacturing"],"rivals":["cad","computer aided design"],"p":4,"a":122,"why":"CAM: computer aided manufacture."}]},"exit":{"q1":{"q":"Explain the difference between first angle and third angle projection.","ideas":[["Where the plan goes: below the front view in first angle, above it in third angle",["below","above","under","on top","top"]],["Each view sits on the opposite side in first angle, the same side in third angle",["opposite","same side","next to","far side","other side","beside"]],["The symbol: wide end of the cone facing the circles in first angle, narrow end in third",["cone","symbol","wide","narrow","circle"]]],"need":2,"model":"In first angle each view is drawn on the opposite side of the front view from the face you look at, so the plan goes below the front view. In third angle each view goes on the same side, so the plan goes above. The symbols show it too: the wide end of the cone faces the circles in first angle, the narrow end in third angle.","good":"you covered %s of the 3 key ideas in question 1.","log":"First and third angle explained"},"q2":{"q":"A part is drawn 42 mm long on a 1:5 drawing. How long is the real part?","opts":["8.4 mm","210 mm","47 mm","420 mm"],"ans":1,"good":"42 × 5 = 210 mm. Drawing to real at 1:5, so multiply.","bad":"drawing to real at 1:5 means multiply: 42 × 5 = <b>210 mm<\/b>. A 1:5 drawing is smaller than the part.","log":"Real size 210 mm"},"q2b":{"q":"Tick the three that are symbol-based drawings.","opts":["Circuit diagram","Isometric drawing","Pneumatic schematic","Exploded view","Flowchart","General arrangement"],"ans":[0,2,4],"good":"circuit diagrams, schematics and flowcharts all use agreed symbols.","bad":"the symbol-based ones are the <b>circuit diagram, pneumatic schematic and flowchart<\/b>. Isometric, exploded and GA drawings show shape.","log":"Three symbol-based drawings"},"q3":{"q":"A section view shows a shaft cut along its length. How is the shaft drawn?","opts":["Hatched at 45°","Not hatched","Hatched in the opposite direction","Shown with hidden lines"],"ans":1,"good":"shafts, bolts, nuts and pins cut along their length are not hatched.","bad":"a shaft cut along its length is <b>not hatched<\/b>, like bolts, nuts and pins. Hatching would only hide its shape.","log":"Shaft not hatched"},"q4":{"q":"A 15 mm pin is drawn at a scale of 4:1. How long is it on the drawing? Type the number and unit.","v":60,"unit":"mm","tol":0.001,"ph":"Number and unit","good":"15 × 4 = 60 mm. An enlargement, so the drawing is bigger.","bad":"real to drawing at 4:1 means multiply: 15 × 4 = <b>60 mm<\/b>. 4:1 is an enlargement.","log":"Drawing size 60 mm"},"q5":{"q":"What does the abbreviation AF mean on a drawing?","acc":["across flats","across the flats","across flat","across flats spanner size"],"rivals":["after","as fitted"],"good":"across flats: the spanner size.","bad":"AF means <b>across flats<\/b>: the distance between opposite flats of a nut, so the spanner size.","log":"AF: across flats"}},"swipeDecks":{"fa":{"q":"First angle or third angle?","L":"First angle","R":"Third angle"},"hx":{"q":"In a section view: hatched or not hatched?","L":"Hatched","R":"Not hatched"},"ph":{"q":"Pneumatic or hydraulic?","L":"Pneumatic","R":"Hydraulic"},"cw":{"q":"Circuit diagram or wiring diagram?","L":"Circuit diagram","R":"Wiring diagram"}},"swipe":[{"id":"W01","d":"fa","s":"The plan is drawn below the front view","ans":"First angle","a":27,"why":"First angle: each view goes on the opposite side, so the view from above sits below."},{"id":"W02","d":"fa","s":"The plan is drawn above the front view","ans":"Third angle","a":28,"why":"Third angle: each view sits on the same side as the face it shows."},{"id":"W03","d":"fa","s":"The view from the left is drawn on the left of the front view","ans":"Third angle","a":28,"why":"Same side as the face you look at: third angle."},{"id":"W04","d":"fa","s":"The view from the left is drawn on the right of the front view","ans":"First angle","a":27,"why":"Opposite side from the face you look at: first angle."},{"id":"W05","d":"fa","s":"Each view sits on the opposite side from the face it shows","ans":"First angle","a":27,"why":"That is the first angle rule."},{"id":"W06","d":"fa","s":"Each view sits next to the face it shows","ans":"Third angle","a":29,"why":"Third angle: each view sits next to the face it shows (slide 29)."},{"id":"W07","d":"fa","s":"Symbol: the wide end of the cone faces the circles","ans":"First angle","a":30,"why":"First angle symbol. In third angle the narrow end points at the circles."},{"id":"W08","d":"fa","s":"Symbol: the narrow end of the cone points at the circles","ans":"Third angle","a":30,"why":"Third angle symbol."},{"id":"W09","d":"fa","s":"The object sits between you and the plane of projection","ans":"First angle","a":40,"why":"Summer 2024 Q5c mark scheme: in first angle the object is between the observer and the plane."},{"id":"W10","d":"fa","s":"The plane of projection sits between you and the object","ans":"Third angle","a":40,"why":"Third angle: the plane is between the observer and the object."},{"id":"W11","d":"hx","s":"Solid metal that the cutting plane passes through","ans":"Hatched","a":46,"why":"Hatching says: this is solid material that the cut went through."},{"id":"W12","d":"hx","s":"A hole drilled through the part","ans":"Not hatched","a":46,"why":"Hollow spaces such as holes are left clear."},{"id":"W13","d":"hx","s":"A bolt cut along its length","ans":"Not hatched","a":46,"why":"Bolts, nuts, shafts and pins cut along their length are not hatched."},{"id":"W14","d":"hx","s":"A shaft cut along its length","ans":"Not hatched","a":46,"why":"Shafts cut lengthways are not hatched: it would only hide their shape."},{"id":"W15","d":"hx","s":"A thin rib cut along its length","ans":"Not hatched","a":46,"why":"Tricky: thin ribs cut lengthways are not hatched either, or the part would look solid."},{"id":"W16","d":"hx","s":"The wall of a flanged bush, cut through the middle","ans":"Hatched","a":45,"why":"The cut goes through solid material, so it is hatched. The bore stays clear."},{"id":"W17","d":"hx","s":"The wall of a cast pump body, cut through","ans":"Hatched","a":46,"why":"Solid material the cut went through."},{"id":"W18","d":"hx","s":"A nut that the cutting plane passes through","ans":"Not hatched","a":46,"why":"Tricky: nuts are on the list of parts that are not hatched."},{"id":"W19","d":"hx","s":"Two plates that touch, both cut through","ans":"Hatched","a":46,"why":"Both are hatched, in opposite directions, so you can tell where one ends."},{"id":"W20","d":"ph","s":"Open (unfilled) triangles on the symbols","ans":"Pneumatic","a":67,"why":"Open triangles mean air."},{"id":"W21","d":"ph","s":"Filled (solid) triangles on the symbols","ans":"Hydraulic","a":67,"why":"Filled triangles mean liquid."},{"id":"W22","d":"ph","s":"Return lines drawn back to a tank","ans":"Hydraulic","a":67,"why":"Oil is reused, so it returns to the tank."},{"id":"W23","d":"ph","s":"Used fluid exhausted to the atmosphere","ans":"Pneumatic","a":67,"why":"Used air is let out, not returned."},{"id":"W24","d":"ph","s":"Energy from a compressor","ans":"Pneumatic","a":67,"why":"A compressor supplies compressed air."},{"id":"W25","d":"ph","s":"Energy from a pump driven by a motor","ans":"Hydraulic","a":67,"why":"A pump drives the oil round."},{"id":"W26","d":"ph","s":"A light, fast clamping job on a packing line","ans":"Pneumatic","a":67,"why":"Light, fast, clean jobs suit air."},{"id":"W27","d":"ph","s":"A press that must give a very large, steady force","ans":"Hydraulic","a":67,"why":"Heavy loads such as presses suit hydraulics (slide 67)."},{"id":"W28","d":"ph","s":"A relief valve to stop the oil pressure getting too high","ans":"Hydraulic","a":66,"why":"The relief valve limits pressure in a hydraulic circuit."},{"id":"W29","d":"cw","s":"Shows how the circuit works, using BS 3939 symbols","ans":"Circuit diagram","a":59,"why":"A circuit diagram shows how components connect, not where they sit."},{"id":"W30","d":"cw","s":"Shows which terminal each wire goes to","ans":"Wiring diagram","a":60,"why":"A wiring diagram shows how to wire it."},{"id":"W31","d":"cw","s":"Shows the wire colours: brown, blue, green and yellow","ans":"Wiring diagram","a":60,"why":"Wire colours are on the wiring diagram."},{"id":"W32","d":"cw","s":"Wires drawn as straight lines between the symbols","ans":"Circuit diagram","a":59,"why":"Straight lines make the connections easy to follow."},{"id":"W33","d":"cw","s":"Shows where each part really sits in the enclosure","ans":"Wiring diagram","a":60,"why":"The real layout is the wiring diagram."},{"id":"W34","d":"cw","s":"Drawn first, to design how a new circuit will work","ans":"Circuit diagram","a":59,"why":"Designers start with the circuit diagram."},{"id":"W35","d":"cw","s":"Used by an electrician fitting a light in a building","ans":"Wiring diagram","a":60,"why":"Installers need to know where each wire goes."}],"symbols":[{"id":"SY01","q":"What does this symbol show?","art":"<svg viewBox=\"0 0 160 90\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"A circuit or fluid power symbol\"><line x1=\"30.0\" y1=\"45.0\" x2=\"72.5\" y2=\"45.0\" style=\"fill:none;stroke:var(--art);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round\"/><line x1=\"72.5\" y1=\"15.0\" x2=\"72.5\" y2=\"75.0\" style=\"fill:none;stroke:var(--art);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round\"/><line x eturn":"Single-acting has one port and a spring. This one has two ports."},"a":68,"p":2,"t":{"k":"short","acc":["double acting cylinder","double acting","double acting ram"]}},{"id":"SY11","q":"What does this symbol show?","art":"<svg viewBox=\"0 0 160 90\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"A circuit or fluid power symbol\"><circle cx=\"80.0\" cy=\"45.0\" r=\"25.0\" style=\"fill:none;stroke:var(--art);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round\"/><path d=\"M70.0 36.0 L90.0 36.0 L80.0 20.0 Z\" style=\"fill:var(--art);stroke:var(--art);stroke-width:1.5;stroke-linejoin:round\"/><line x1=\"80.0\" y1=\"70.0\" x2=\"80.0\" y2=\"85.0\" style=\"fill:none;stroke:var(--art);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round\"/><line x1=\"80.0\" y1=\"20.0\" x2=\"80.0\" y2=\"5.0\" style=\"fill:none;stroke:var(--art);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round\"/><\/svg>","opts":["Hydraulic pump","Air supply","Motor","Lamp"],"why":"A hydraulic pump: a circle with a filled triangle. Filled means liquid.","fb":{"Air supply":"An air supply symbol has an open triangle. Filled means oil."},"a":68,"p":2,"t":{"k":"short","acc":["hydraulic pump","pump","a pump","hydraulic pump fixed","fixed displacement pump"]}},{"id":"SY12","q":"What does this symbol show?","art":"<svg viewBox=\"0 0 160 90\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"A circuit or fluid power symbol\"><line x1=\"55.0\" y1=\"30.0\" x2=\"55.0\" y2=\"55.0\" style=\"fill:none;stroke:var(--art);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round\"/><line x1=\"55.0\" y1=\"55.0\" x2=\"105.0\" y2=\"55.0\" style=\"fill:none;stroke:var(--art);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round\"/><line x1=\"105.0\" y1=\"55.0\" x2=\"105.0\" y2=\"30.0\" style=\"fill:none;stroke:var(--art);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round\"/><line x1=\"80.0\" y1=\"15.0\" x2=\"80.0\" y2=\"50.0\" style=\"fill:none;stroke:var(--art);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round\"/><\/svg>","opts":["Tank","Earth","Exhaust","Cell"],"why":"A tank: an open-topped box with the return line going in. Oil goes back to it.","fb":{},"a":68,"p":2,"t":{"k":"short","acc":["tank","reservoir","oil tank","hydraulic tank","a tank"]}},{"id":"SY13","q":"What does this symbol show?","art":"<svg viewBox=\"0 0 160 90\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"A circuit or fluid power symbol\"><circle cx=\"80.0\" cy=\"45.0\" r=\"20.0\" style=\"fill:none;stroke:var(--art);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round\"/><path d=\"M71.0 42.0 L89.0 42.0 L80.0 29.0 Z\" style=\"fill:none;stroke:var(--art);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round\"/><line x1=\"80.0\" y1=\"25.0\" x2=\"80.0\" y2=\"5.0\" style=\"fill:none;stroke:var(--art);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round\"/><\/svg>","opts":["Air supply","Hydraulic pump","Lamp","Motor"],"why":"An air supply (pressure source): a circle with an open triangle. Open means air.","fb":{"Hydraulic pump":"The pump has a filled triangle. This one is open: air."},"a":68,"p":2,"t":{"k":"short","acc":["air supply","compressor","pressure source","air","compressed air supply","pneumatic supply"]}}],"hintSymbols":"Look at the shape first: a box for a resistor or fuse, a circle for a lamp, motor or pump. Then the detail: filled triangles mean liquid, open triangles mean air.","choose":[{"id":"WD01","s":"A client with no engineering background wants to see your idea at a meeting today.","ans":"Freehand sketch","say":"a freehand sketch","opts":["Orthographic drawing","Wiring diagram","General arrangement"],"a":37,"ideas":[["Quick to draw, and easy to change in the meeting",["quick","fast","change","minutes","speed","easy to draw"]],["Easy to follow with no technical knowledge or conventions",["easy","understand","follow","technical","convention","simple","knowledge","plain"]]],"need":2,"model":"A freehand sketch is quick to draw and change while you talk, and it has no formal conventions, so a client with no engineering knowledge can follow it.","fb":{"Orthographic drawing":"The client may not read orthographic views. They want the idea, not every size."}},{"id":"WD02","s":"A machinist must make a bracket exactly to size.","ans":"Orthographic drawing","say":"an orthographic drawing","opts":["Isometric drawing","Freehand sketch","Block diagram"],"a":37,"ideas":[["Each view shows a face in its true shape and size",["true","shape","face","view","size"]],["Every dimension, the material and the finish are given",["dimension","size","material","finish","tolerance","measure","exact"]]],"need":2,"model":"An orthographic drawing looks straight at each face, so each shows its true shape and size, and it carries every dimension, the material and the finish the machinist needs.","fb":{"Isometric drawing":"Isometric hides some features and distorts circles, so a part cannot be made from it alone."}},{"id":"WD03","s":"A brochure needs a picture of the finished product.","ans":"Isometric drawing","say":"an isometric drawing (or a CAD render)","opts":["Orthographic drawing","Schematic","Section view"],"a":37,"ideas":[["It shows the whole object in 3D, three faces at once",["3d","three","faces","whole","looks like","picture","realistic"]],["Customers can picture it without technical knowledge",["customer","picture","easy","understand","technical","see"]]],"need":2,"model":"An isometric drawing or render shows the whole product in 3D, so a customer can picture it without reading technical views."},{"id":"WD04","s":"A fitter must put a gearbox together in the right order.","ans":"Exploded view","say":"an exploded view","opts":["General arrangement","Circuit diagram","Detail view"],"a":50,"ideas":[["Parts are pulled apart along the line they go together on",["apart","pulled","line","separate","spread"]],["It shows the order and how the parts fit",["order","fit","sequence","together","assemble"]],["Numbered parts link to the parts list",["number","parts list","balloon","list"]]],"need":2,"model":"An exploded view pulls the parts apart along the line they assemble on, so the fitter can see the order and how each part fits, and the numbers link to the parts list.","fb":{"General arrangement":"A GA shows where everything sits in the whole product, not the order of assembly."}},{"id":"WD05","s":"An installer needs to know where a new machine sits on the factory floor and where it is fixed down.","ans":"General arrangement","say":"a general arrangement (GA) drawing","opts":["Exploded view","Flowchart","Detail view"],"a":49,"ideas":[["It shows the whole product and where everything sits",["whole","where","position","sits","layout","everything"]],["Overall sizes and fixing points, usually at a reduction scale",["overall","fixing","size","scale","bolt","fixed"]]],"need":2,"model":"A GA shows the whole machine and where it sits, with overall sizes and fixing points, which is what an installer needs."},{"id":"WD06","s":"An electrician must wire a control panel: which terminal each wire goes to, and its colour.","ans":"Wiring diagram","say":"a wiring diagram","opts":["Circuit diagram","Block diagram","Isometric drawing"],"a":60,"ideas":[["Shows the real layout: where each part sits",["layout","where","position","real","sits"]],["Shows each terminal and the wire colours",["terminal","colour","brown","blue","wire"]]],"need":2,"model":"A wiring diagram shows where each part really sits and which terminal each coloured wire goes to, so the electrician can wire it.","fb":{"Circuit diagram":"A circuit diagram shows how it works, not where each wire physically goes."}},{"id":"WD07","s":"A designer wants to show how a new alarm circuit will work before it is built.","ans":"Circuit diagram","say":"a circuit diagram","opts":["Wiring diagram","Exploded view","General arrangement"],"a":59,"ideas":[["Standard BS 3939 symbols for each component",["symbol","standard","bs 3939","bs3939"]],["Shows how the components connect and how it works",["connect","how it works","works","function","straight","lines"]]],"need":2,"model":"A circuit diagram uses standard BS 3939 symbols and straight lines for the wires, so it shows how the components connect and how the circuit works."},{"id":"WD08","s":"A maintenance team must understand how the air cylinders on a packing machine are controlled.","ans":"Pneumatic schematic","say":"a pneumatic schematic","opts":["Wiring diagram","Isometric drawing","Assembly drawing"],"a":62,"ideas":[["ISO 1219-1 symbols for the valves and cylinders",["symbol","iso","standard","1219"]],["Shows how the parts connect and how the circuit works, not where they sit",["connect","how it works","works","flow","not where","circuit"]]],"need":2,"model":"A pneumatic schematic uses ISO 1219-1 symbols to show how the valves and cylinders connect and how the air flows, so the team can follow and fault-find it."},{"id":"WD09","s":"A new apprentice must follow the steps for checking a drilled hole, including what to do if it fails.","ans":"Flowchart","say":"a flowchart","opts":["Block diagram","Section view","General arrangement"],"a":56,"ideas":[["Shows the steps in order",["step","order","sequence","follow"]],["A diamond shows the decision, with yes and no paths",["decision","diamond","yes","no","fail","pass"]]],"need":2,"model":"A flowchart puts the steps in order with standard shapes, and a diamond shows the pass or fail decision with a path for each answer.","fb":{"Block diagram":"A block diagram is a top-down overview of a system, not a list of steps and decisions."}},{"id":"WD10","s":"A manager with little technical knowledge wants an overview of how a heating system works.","ans":"Block diagram","say":"a block diagram","opts":["Circuit diagram","Wiring diagram","Section view"],"a":55,"ideas":[["Input, process and output blocks joined by arrows",["input","process","output","block","arrow"]],["A top-down overview, so little technical knowledge is needed",["overview","simple","technical","knowledge","easy","no wiring","top down"]]],"need":2,"model":"A block diagram shows input, process and output blocks joined by arrows, a top-down overview with no wiring, so little technical knowledge is needed."},{"id":"WD11","s":"An inspector needs to see the inside of a cast valve body without lots of dashed lines.","ans":"Section view","say":"a section view","opts":["Isometric drawing","Exploded view","Block diagram"],"a":44,"ideas":[["Shows the inside as if cut along a cutting plane",["inside","cut","cutting plane","slice"]],["Hatching shows the solid material, so no hidden lines are needed",["hatch","solid","hidden","dashed","clear"]]],"need":2,"model":"A section view shows the inside as if it had been cut along a cutting plane, with the solid material hatched, so there is no mass of hidden lines."},{"id":"WD12","s":"A tiny groove on a large shaft drawing is too small to dimension clearly.","ans":"Detail view","say":"a detail view","opts":["Section view","General arrangement","Freehand sketch"],"a":47,"ideas":[["Enlarges one small area at its own scale",["enlarge","bigger","larger","scale","zoom","4:1","magnif"]],["Marked with a circle and a letter, for example DETAIL B",["circle","letter","label","detail b","marked"]]],"need":2,"model":"A detail view enlarges that small area at its own scale, for example DETAIL B, SCALE 4:1, marked with a circle and a letter on the main view."}],"sequences":[{"id":"Q1","title":"Drawing in third angle","a":31,"steps":["Choose the best face as the front view","Draw the front view lightly","Project the plan above it","Project the end view to the side","Add hidden detail and centre lines","Line in outlines; clear construction","Add symbol, scale and title block"],"why":"The method on lesson slide 31: front view first, then project the other views from it, detail, line in, then the sheet information."},{"id":"Q2","title":"Drawing a section view","a":46,"steps":["Decide where the part needs to be cut","Draw the cutting plane with arrows and letters","Draw the view as if the near piece were lifted away","Hatch the cut solid material at 45°","Leave holes, bolts and shafts clear","Label it SECTION A-A"],"why":"Cutting plane first, then the cut view, then hatching by the rules, then the label that matches the plane (slides 44 to 46)."},{"id":"Q3","title":"Before you use a drawing","a":139,"steps":["Read the title block: what the part is, and its number","Check the revision letter is the current one","Check the scale","Check the projection symbol","Read the views and the notes"],"why":"\"Check title block, revision, scale and symbol first\" (slide 139). An old revision means scrapped parts."},{"id":"Q4","title":"From idea to part","a":122,"steps":["Freehand sketch to share the idea","Isometric drawing or render for the client","Build the 3D CAD model","Test it by simulation (FEA)","Produce orthographic drawings from the model","CAM sends the code to the CNC machine"],"why":"Sketch, show, model, test, document, make: the route through slides 16, 20, 36 and 122."},{"id":"Q5","title":"A single-acting cylinder at work","a":62,"steps":["Air comes from the air supply","The button is pressed: the 3/2 valve opens port 1 to port 2","Air pushes the piston out","The button is released: the valve springs back","Air in the cylinder exhausts through port 3","The spring pushes the piston back"],"why":"The pneumatic schematic on slide 62, step by step."},{"id":"Q6","title":"A flowchart for checking a drilled hole","a":56,"steps":["Start (oval)","Drill the hole (rectangle)","Measure the hole (rectangle)","In tolerance? (diamond)","Yes: pass the part. No: record and reject it","End (oval)"],"why":"Oval to start and end, rectangles for actions, a diamond for the decision (slide 56)."}],"sortFeat":[{"id":"F1","title":"What does each surface finish symbol tell the machinist?","a":99,"bins":["Machine it (remove material)","Do not remove material","Any process allowed"],"cards":[["A tick with a bar across the top","Machine it (remove material)"],["A tick with a circle in the V","Do not remove material"],["A plain tick, no bar or circle","Any process allowed"],["A bearing face that must reach Ra 0.4","Machine it (remove material)"],["The outside of a casting, left as cast","Do not remove material"],["A forged face that must stay as forged","Do not remove material"],["A face to be turned to Ra 1.6","Machine it (remove material)"],["Roughness given, but the method left to the maker","Any process allowed"]],"why":"Lesson slide 99: a bar means machine it, a circle means do not remove material, a plain tick leaves the process open. The number is the maximum Ra."},{"id":"F2","title":"Counterbore or countersink?","a":111,"bins":["Counterbore","Countersink"],"cards":[["A flat-bottomed, larger hole","Counterbore"],["A cone-shaped recess","Countersink"],["Suits a cap head screw","Counterbore"],["Suits a countersunk screw","Countersink"],["Usually 90°","Countersink"],["CBORE","Counterbore"],["CSK","Countersink"],["The head sits below the surface on a flat seat","Counterbore"]],"why":"Both let a screw head sit flush or below the surface. Flat bottom: counterbore. Cone: countersink (slide 111)."},{"id":"F3","title":"CAD or hand drawing: strength or drawback?","a":126,"bins":["CAD strength","CAD drawback","Hand drawing strength","Hand drawing drawback"],"cards":[["Quick to change, copy and share","CAD strength"],["Files go straight to CNC machines","CAD strength"],["Software, training and computers cost money","CAD drawback"],["Relies on computers and power","CAD drawback"],["Can be done anywhere with cheap kit","Hand drawing strength"],["No power or software needed","Hand drawing strength"],["Slow to change","Hand drawing drawback"],["Can be damaged or lost","Hand drawing drawback"]],"why":"Lesson slide 126. CAD costs money and needs skilled users, but it is quicker to change and share and links to manufacture."},{
