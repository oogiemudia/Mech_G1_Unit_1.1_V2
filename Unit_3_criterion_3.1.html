an see how they go together. You find it in instructions and spares catalogues."},{"id":"TB02","term":"Schematic","ban":["symbol","circuit","diagram","system"],"p":2,"a":71,"ideas":[["Shows how something works, not what it looks like",["works","not what it looks","connect","how it","not how it looks"]],["Uses agreed signs, like the Tube map",["tube","map","agreed","sign","standard","iso"]]],"model":"A drawing that shows how things connect and work, using agreed signs, not what they really look like. Like the Tube map."},{"id":"TB03","term":"Section view","ban":["cut","inside","hatching","slice"],"p":2,"a":71,"ideas":[["Shows the hidden interior as if a plane went through it",["plane","through","interior","within","middle"]],["Solid material shown with lines at 45°",["45","lines","solid","material"]]],"model":"A view as if a plane had gone straight through the part, so you can see what is within it, with the solid material drawn with lines at 45°."},{"id":"TB04","term":"Flowchart","ban":["steps","arrows","process","decision"],"p":2,"a":71,"ideas":[["Shows the order to do things in",["order","sequence","first","then","next"]],["Standard shapes such as an oval, rectangle and diamond",["oval","rectangle","diamond","shape","box"]],["Anyone can follow it",["follow","anyone","understand","everyone"]]],"model":"A chart that shows the order to do things in, using standard shapes: ovals to start and end, rectangles for actions, diamonds for yes or no questions, so anyone can follow it."},{"id":"TB05","term":"General arrangement","ban":["whole","product","assembly","where"],"p":2,"a":49,"ideas":[["Shows how everything fits into the complete machine and its position",["complete","machine","position","every","all","location"]],["Reduced scale with overall sizes and fixing points for installers",["scale","overall","fixing","install","big picture"]]],"model":"A drawing of the complete machine showing how every unit fits together and its position, at a reduced scale with overall sizes and fixing points, for installers and clients."},{"id":"TB06","term":"Isometric drawing","ban":["3D","30","angle","picture"],"p":1,"a":20,"ideas":[["Shows three faces at once in one view",["three faces","faces","one view","solid","depth"]],["Same scale on every axis, no perspective",["same scale","perspective","axis","axes"]],["Used for clients or brochures",["client","brochure","customer","box"]]],"model":"One drawing showing three faces of an object at once, like the image on a flat-pack box, with the same scale on every axis and no perspective."},{"id":"TB07","term":"Third angle","ban":["third","plan","above","symbol"],"p":1,"a":28,"ideas":[["Each view sits on the same side as the face it shows",["same side","next to","beside"]],["The view from the left goes on the left; the top view goes on top",["left","top","on top"]]],"model":"A way of laying out views where each one sits on the same side as the face it shows: the view from the left goes on the left, the top view on top."},{"id":"TB08","term":"Title block","ban":["title","block","name","number"],"p":3,"a":78,"ideas":[["A panel, usually bottom right of the sheet",["bottom right","panel","corner","box"]],["Says what the drawing is, who owns it, its scale, date and revision",["scale","date","revision","owner","who","drawn","approved","what it is"]]],"model":"The panel in the bottom right corner that says what the drawing shows, who owns and approved it, the scale, the date and the revision."},{"id":"TB09","term":"Scale","ban":["size","ratio","bigger","smaller"],"p":3,"a":80,"ideas":[["Compares the drawing with the real part, written as two numbers",["compare","drawing","real","two numbers","1:",":1"]],["Lets a large part fit the sheet or a small one be seen",["fit","sheet","paper","seen","large","tiny","small part"]]],"model":"How the drawing compares with the real part, written as two numbers with the drawing first, so a big part fits the sheet or a tiny one can be seen."},{"id":"TB10","term":"Hidden detail line","ban":["hidden","dashed","see","line"],"p":3,"a":86,"ideas":[["Shows an edge behind the surface, out of view",["behind","out of","view","back","inside","not visible","invisible"]],["Drawn thin, broken into short pieces",["thin","broken","short","gaps","dash"]]],"model":"A thin, broken mark showing an edge that is behind the surface you are looking at, such as the inside of a hole."},{"id":"TB11","term":"Countersink","ban":["screw","cone","sink","flush"],"p":4,"a":111,"ideas":[["A sloping, pointed recess at the top of a hole",["slop","angle","recess","point","taper","90"]],["So a head sits level with the surface",["level","head","surface","sit","even"]]],"model":"A recess with sloping sides, usually at 90°, cut at the top of a hole so a head with a sloping underside sits level with the surface."},{"id":"TB12","term":"PCD","ban":["pitch","circle","diameter","holes"],"p":4,"a":109,"ideas":[["A ring through the centres of a set of evenly spaced openings",["ring","centre","through","evenly","spaced","round"]],["Lets one note describe all of them",["note","one","all","flange","bolt"]]],"model":"The size of the ring that passes through the centres of a set of evenly spaced bolt openings on a flange, so one note can describe them all."},{"id":"TB13","term":"CAM","ban":["computer","manufacture","CAD","machine"],"p":4,"a":122,"ideas":[["Turns the 3D model into code or instructions",["code","instruction","program","model","g code"]],["Drives a CNC mill, lathe or 3D printer",["cnc","mill","lathe","printer","cut"]]],"model":"Using the 3D model to make the code that drives a CNC mill, lathe or 3D printer, so the part is made straight from the model."},{"id":"TB14","term":"Ra","ban":["rough","smooth","surface","finish"],"p":4,"a":99,"ideas":[["An average measured in micrometres",["average","micro","um","number","measure"]],["A lower number means a finer, more polished face",["lower","smaller","polish","fine","less"]]],"model":"A number, in micrometres, giving the average height of the bumps on a face. The lower the number, the more polished the face."}],"why":[{"id":"Y01","q":"Would you hand a freehand sketch to a CNC machinist to make a part?","a":17,"steps":[{"label":"Pick the answer","correct":"No","wrongs":["Yes, if it is neat","Yes, if it has notes","Only for plastic parts"]},{"label":"Pick the reason","correct":"It is not to scale and has no full set of sizes or conventions","wrongs":["Sketches are only for electrical work","Machinists cannot read pencil","It shows too many hidden lines"]}]},{"id":"Y02","q":"Is an isometric drawing enough on its own to make a part?","a":21,"steps":[{"label":"Pick the answer","correct":"No, it is usually paired with an orthographic drawing","wrongs":["Yes, it shows everything","Yes, if it is drawn in CAD","Only if it is at 1:1"]},{"label":"Pick the reason","correct":"Hidden features on the far side do not show, and circles become ellipses","wrongs":["Isometric drawings have no dimensions by law","It is always drawn at the wrong scale","It uses electrical symbols"]}]},{"id":"Y03","q":"Compare first and third angle: where does the plan go in each?","a":29,"steps":[{"label":"Pick the answer","correct":"First angle below the front view; third angle above it","wrongs":["First angle above; third angle below","Both above the front view","Both below the front view"]},{"label":"Pick the reason","correct":"In first angle each view goes on the opposite side; in third angle, the same side","wrongs":["The plan always follows the title block","First angle is for metric drawings only","Third angle has no plan"]}]},{"id":"Y04","q":"In a section view, is a bolt that is cut along its length hatched?","a":46,"steps":[{"label":"Pick the answer","correct":"No","wrongs":["Yes, at 45°","Yes, in the opposite direction","Only if it is steel"]},{"label":"Pick the reason","correct":"Hatching it would only hide its shape; bolts, nuts, shafts and pins are left clear","wrongs":["Bolts are always drawn as hidden lines","Bolts are never cut by a cutting plane","Hatching is only for plastics"]}]},{"id":"Y05","q":"Two parts that touch are both cut in a section. How are they hatched?","a":46,"steps":[{"label":"Pick the answer","correct":"In opposite directions","wrongs":["In the same direction","Only one of them is hatched","With dashed lines"]},{"label":"Pick the reason","correct":"So the reader can tell where one part ends and the other begins","wrongs":["It shows which part is heavier","It shows the order they were made in","It saves ink"]}]},{"id":"Y06","q":"Compare a pneumatic and a hydraulic schematic. Which one uses filled triangles?","a":67,"steps":[{"label":"Pick the answer","correct":"Hydraulic","wrongs":["Pneumatic","Both","Neither"]},{"label":"Pick the reason","correct":"A filled triangle means a liquid; an open triangle means air","wrongs":["Filled triangles mean a higher voltage","Filled triangles show the fastest valve","Filled triangles mark the exhaust"]}]},{"id":"Y07","q":"A machinist has 200 brackets to make from a drawing marked Rev B. The current drawing is Rev C. Should they start?","a":79,"steps":[{"label":"Pick the answer","correct":"No, not until they have the current revision","wrongs":["Yes, B and C are the same","Yes, as long as the scale matches","Yes, revisions only change the title"]},{"label":"Pick the reason","correct":"An old revision can mean scrapped parts, wasted money and parts that do not fit","wrongs":["Revision letters only show who drew it","Rev B is always the most accurate","The scale changes with each revision"]}]},{"id":"Y08","q":"Should a machinist measure a line on the print to find a size that is not dimensioned?","a":80,"steps":[{"label":"Pick the answer","correct":"No","wrongs":["Yes, with a steel rule","Yes, if the scale is 1:1","Yes, on any CAD print"]},{"label":"Pick the reason","correct":"Dimensions give the real size; the paper can stretch or be printed at a different size, so never measure it","wrongs":["Rulers are not allowed in workshops","Prints are always at 2:1","Undimensioned sizes do not matter"]}]},{"id":"Y09","q":"A cutting plane line and a centre line fall in exactly the same place. Which is drawn?","a":88,"steps":[{"label":"Pick the answer","correct":"The cutting plane line","wrongs":["The centre line","Both, on top of each other","Neither"]},{"label":"Pick the reason","correct":"Order of priority: outline, hidden detail, cutting plane, centre line, projection line","wrongs":["Centre lines are always drawn last and so win","Cutting planes are optional","Centre lines are only for circles"]}]},{"id":"Y10","q":"Should a designer ask for a polished finish, Ra 0.4, on every face of a part?","a":100,"steps":[{"label":"Pick the answer","correct":"No, only where the part needs it","wrongs":["Yes, always","Yes, on cast parts","Only on the underside"]},{"label":"Pick the reason","correct":"A smoother finish takes longer and costs more","wrongs":["Polished faces rust faster","Ra 0.4 is the roughest finish","Drawings cannot show Ra on every face"]}]},{"id":"Y11","q":"Compare a counterbore and a countersink. Which suits a cap head screw?","a":111,"steps":[{"label":"Pick the answer","correct":"Counterbore","wrongs":["Countersink","Either","Neither"]},{"label":"Pick the reason","correct":"A counterbore has a flat bottom for the flat underside of a cap head","wrongs":["A countersink is cone-shaped for a cap head","Cap heads only fit tapped holes","Counterbores are always 90°"]}]},{"id":"Y12","q":"A small workshop makes one-off repair parts and rarely changes a design. Must it buy CAD?","a":126,"steps":[{"label":"Pick the answer","correct":"Not necessarily: weigh the cost against the benefit","wrongs":["Yes, hand drawing is banned","No, CAD is never useful","Yes, CAD is free"]},{"label":"Pick the reason","correct":"CAD is quick to change and share but costs money for software, training and computers","wrongs":["CAD only works for electrical drawings","Hand drawings cannot show sizes","CAD cannot produce orthographic drawings"]}]}],"errors":[{"id":"E01","a":20,"chunks":["An isometric drawing shows three faces at once,","with width and depth lines at 45°,","and the same scale on every axis."],"wrong":1,"fix":"Isometric width and depth lines are at 30°, not 45° (lesson slide 20). 45° is oblique drawing."},{"id":"E02","a":28,"chunks":["In third angle projection,","the plan is drawn above the front view,","and the view from the left goes on the right."],"wrong":2,"fix":"In third angle the view from the left goes on the left. On the right is first angle (lesson slide 28)."},{"id":"E03","a":30,"chunks":["In the third angle symbol,","the wide end of the cone","faces the circles."],"wrong":1,"fix":"In the third angle symbol the narrow end of the cone points at the circles. The wide end facing them is first angle."},{"id":"E04","a":17,"chunks":["Freehand sketches are quick and easy to change,","are drawn to an exact scale,","and suit clients with no engineering knowledge."],"wrong":1,"fix":"Freehand sketches are not to scale: they are in proportion only, which is why a part cannot be made from one (slide 17)."},{"id":"E05","a":46,"chunks":["In a section view, cut solid material is hatched,","holes are left clear,","and bolts cut along their length are hatched at 45°."],"wrong":2,"fix":"Bolts, nuts, shafts and pins cut along their length are not hatched (lesson slide 46)."},{"id":"E06","a":67,"chunks":["Pneumatic symbols use filled triangles,","the used air is exhausted to atmosphere,","and the energy comes from a compressor."],"wrong":0,"fix":"Pneumatic symbols use open triangles. Filled triangles mean liquid: hydraulic (slide 67)."},{"id":"E07","a":59,"chunks":["A circuit diagram shows how the components connect,","with the wires drawn as straight lines,","and the colour of every wire."],"wrong":2,"fix":"Wire colours are on the wiring diagram. A circuit diagram shows how it works, not how to wire it (slides 59 and 60)."},{"id":"E08","a":81,"chunks":["A part is drawn 45 mm long at 1:2,","so the real part","is 22.5 mm long."],"wrong":2,"fix":"Drawing to real at 1:2 means multiply: 45 × 2 = 90 mm (lesson slide 81)."},{"id":"E09","a":80,"chunks":["A scale of 1:10","shows the part at ten times","its real size."],"wrong":1,"fix":"1:10 is a reduction: one tenth of the real size. Ten times bigger would be 10:1 (slide 80)."},{"id":"E10","a":88,"chunks":["Where a visible edge falls on a hidden edge,","draw the hidden edge,","because only one line can go in the same place."],"wrong":1,"fix":"The visible outline is drawn: it comes first in the order of priority (slide 88)."},{"id":"E11","a":99,"chunks":["Ra is the average roughness of a surface,","measured in millimetres,","and the number on the symbol is the most allowed."],"wrong":1,"fix":"Ra is measured in micrometres (µm), thousandths of a millimetre (slide 99)."},{"id":"E12","a":99,"chunks":["On a surface finish symbol,","a circle in the V means machine the surface,","and a number gives the maximum Ra."],"wrong":1,"fix":"The circle means do not remove material. The bar means machine it (slide 99)."},{"id":"E13","a":102,"chunks":["M8 × 1 is a metric thread","with an 8 mm pitch","and a 1 mm fine pitch written in."],"wrong":1,"fix":"The 8 is the major diameter in millimetres. The pitch is the 1 mm after the × (slide 102)."},{"id":"E14","a":105,"chunks":["On an orthographic drawing,","MTL means metal,","and it is followed by the grade."],"wrong":1,"fix":"MTL means material. \"Metal\" was not accepted in the Autumn 2025 Paper 2 mark scheme (slide 105)."},{"id":"E15","a":109,"chunks":["PCD means pitch circle diameter:","the outside diameter of the flange","on which a ring of holes is drilled."],"wrong":1,"fix":"The PCD is the circle through the hole centres, not the outside of the flange (slide 109)."},{"id":"E16","a":126,"chunks":["CAD drawings are quick to change and share,","can be sent straight to CNC machines,","and need no training or software costs."],"wrong":2,"fix":"CAD does cost money: software, training and powerful computers, and it needs skilled users (slide 126)."}],"examiner":[{"id":"X01","src":"Core Paper 2, Autumn 2024, Q11b","q":"Designers will show new car body ideas to potential clients with no engineering knowledge, using freehand sketches. Explain two different reasons why this method of communication is appropriate for this audience.","max":4,"sl":18,"got":3,"a":"Sketches are quick to draw. They are also easy for the clients to understand because they have no engineering conventions.","why":"\"Quick to draw\" earns the mark for the reason, but it has no linked explanation: 1. The second reason is linked (no conventions, so easy to follow): 2. Total 3.","model":"No formal conventions [1], so people without a technical background can follow them [1]. Quick to draw or change [1], so ideas can change in response to client feedback [1]."},{"id":"X02","src":"Core Paper 2, Summer 2026, Q6a","q":"Explain one characteristic of isometric drawings in engineering.","max":2,"sl":22,"got":2,"a":"An isometric drawing is a 2D drawing that shows the object in 3D, so you can see three faces at once.","why":"A characteristic (2D drawing) with its linked explanation (shows a 3D view). Both marks.","model":"A 2D drawing [1] that shows the object in a 3D view [1]. Or: width and depth at 30° [1] with verticals at 90° [1]. Or: same scale on all axes [1], which shows size and shape [1]."},{"id":"X03","src":"Core Paper 2, Summer 2024, Q5c","q":"Explain two differences between first angle and third angle orthographic projection drawings in terms of how the object being drawn is shown.","max":2,"sl":40,"got":1,"a":"In first angle the plan is drawn below the front view, whereas in third angle it is drawn above. Third angle is used more in the USA.","why":"The plan comparison has both sides, joined by whereas: 1 mark. Where a projection is used is not about how the object is shown, so it earns nothing.","model":"First angle: plan below the front view; third angle: plan above [1]. First angle: object between observer and plane; third angle: plane between observer and object [1]."},{"id":"X04","src":"Core Paper 2, Autumn 2023, Q7b","q":"Explain two purposes of a flowchart drawing.","max":4,"sl":57,"got":3,"a":"It shows the steps of a process in order, so they are followed correctly. It uses standard symbols.","why":"The first purpose is fully linked (2). The second names standard symbols but does not say why they help: 1.","model":"Shows the steps or sequence [1], so the order is clear [1]. Gives everyone the same understanding [1] by using standard symbols [1]. Shows sub-processes [1], keeping the chart shorter [1]."},{"id":"X05","src":"Core Paper 2, Summer 2026, Q6b","q":"Explain two characteristics of pneumatic schematics.","max":4,"sl":64,"got":4,"a":"They use standard symbols so anyone can understand them. They show how the parts connect rather than where they are, so they are easier to fault-find.","why":"Two characteristics, each with a linked explanation. Full marks.","model":"Standard symbols [1], so anyone can understand it [1]. Shows connections, not physical layout [1], so it is easier to read and fault-find [1]. Shows air flow with arrows [1], so you can follow it [1]."},{"id":"X06","src":"Core Paper 2, Summer 2025, Q9c","q":"An engineer will shut down, service and recommission a high voltage electrical storage system. Identify two types of drawings that may be needed. For each, explain its purpose relevant to this activity.","max":4,"sl":69,"got":3,"a":"A wiring diagram, to show where the wires go when they reconnect it. A circuit diagram.","why":"Wiring diagram with a purpose tied to the job: 2. The circuit diagram is identified but given no purpose: 1. Total 3.","model":"Wiring diagram [1]: the layout of parts and wires [1]. Circuit diagram [1]: each component and how they connect [1]. Exploded view or assembly [1]: helps take apart and rebuild [1]. Schematic [1]: overview of how it works [1]."},{"id":"X07","src":"Core Paper 2, Autumn 2024, Q6","q":"Explain two applications of CAD software in engineering.","max":4,"sl":127,"got":0,"a":"CAD is more accurate than hand drawing. It is also quicker.","why":"Neither point names an application, a use of CAD. Accuracy and speed are advantages, so this earns nothing. Name a use first: producing drawings, virtual models for simulation, or sharing files.","model":"Producing orthographic or assembly drawings [1], used to machine, manufacture or maintain parts [1]. Producing virtual models [1] that can be simulated to test performance [1]. Working with others [1], because files are easy to share [1]."},{"id":"X08","src":"Core Paper 2, Summer 2023, Q5b","q":"Explain two characteristics of a circuit diagram.","max":4,"sl":135,"got":3,"a":"A circuit diagram uses standard symbols for each component, so anyone can tell which component is which whatever language they speak or job they do. A circuit diagram also shows the wires.","why":"Standard symbols with a linked reason: 2. \"Shows the wires\" is a weak version of \"wires drawn as straight lines\", with no link: 1 at most.","model":"Standard symbols [1], so anyone can identify the components [1]. Wires drawn as straight lines [1], so the connections are easy to follow [1]."},{"id":"X09","src":"Core Paper 2, Autumn 2025, Q3a","q":"The title and name are items included in a title block. List two more items that should be included.","max":2,"sl":95,"got":1,"a":"The title of the part and the scale.","why":"The title is given in the question, so it earns nothing. The scale earns 1.","model":"Any two: scale; version; date; projection; company name; checked; notes; general tolerances; material; quantity."},{"id":"X10","src":"Practice question, not from a past paper","q":"Explain why an exploded view is used in a maintenance manual.","max":2,"sl":50,"got":2,"a":"It shows the parts pulled apart in the order they come off, so the engineer can strip it down and rebuild it correctly.","why":"A clear point (parts apart, in order) with a linked reason (strip and rebuild correctly). Both marks.","model":"Shows the parts pulled apart along their line of assembly [1], so the engineer can see the order to take it apart and put it back together [1]."}]};

    out += dpoly([[px,py],[px+L,py],[px+L,py+D],[px,py+D]]) + dl(px + X(s), py, px + X(s), py + D);
    out += dcirc(px + X(hx), py + D/2, hr) + dl(px + X(hx) - hr - 6, py + D/2, px + X(hx) + hr + 6, py + D/2, "centre") + dl(px + X(hx), py + D/2 - hr - 6, px + X(hx), py + D/2 + hr + 6, "centre");
  }
  if (o.end !== false) {
    /* the view from the left: the low step is the left face unless the block is mirrored */
    out += dpoly([[ex,ey],[ex+D,ey],[ex+D,ey+H],[ex,ey+H]]);
    out += dl(ex, ey + H - h, ex + D, ey + H - h, m ? "hidden" : "thick");
    out += dl(ex + D/2 - hr, ey + H - h, ex + D/2 - hr, ey + H, "hidden") + dl(ex + D/2 + hr, ey + H - h, ex + D/2 + hr, ey + H, "hidden");
    out += dl(ex + D/2, ey + H - h - 6, ex + D/2, ey + H + 6, "centre");
  }
  if (o.boxes) {   /* two empty boxes either side of the front view, for "where does the end view go?" */
    var bl = fx - g - D, br = fx + L + g;
    [["A", bl], ["B", br]].forEach(function(b){
      out += '<rect x="'+r1(b[1])+'" y="'+r1(fy)+'" width="'+r1(D)+'" height="'+r1(H)+'" rx="4" style="fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:6 5"/>' +
        '<text x="'+r1(b[1] + D/2)+'" y="'+r1(fy + H/2 + 6)+'" text-anchor="middle" style="fill:var(--amb);font:700 18px Arial,sans-serif">'+b[0]+'</text>'; });
  }
  if (o.sym) { out += projSym(x2 - 62, y2 + 22, 22, o.sym); y2 += 40; }
  var w = x2 - x1 + 20, vw = Math.max(w, 260), vx = x1 - 10 - (vw - w)/2;
  return svgWrap(r1(vx)+" "+r1(y1 - 8)+" "+r1(vw)+" "+r1(y2 - y1 + 16), out, "Orthographic views of a stepped block" + (o.sym ? " with a projection symbol" : ""));
}

/* ---------- Note Reader: a flange with a ring of holes on a pitch circle (lesson slide 109) ---------- */
function flangeArt(n, label){
  var cx = 170, cy = 112, R = 92, P = 62, hr = 10, o = dcirc(cx, cy, R) + dcirc(cx, cy, 30) + dcirc(cx, cy, P, "centre");
  for (var j = 0; j < n; j++) { var a = -Math.PI/2 + 2*Math.PI*j/n, x = cx + P*Math.cos(a), y = cy + P*Math.sin(a);
    o += dcirc(x, y, hr) + dl(x - hr - 5, y, x + hr + 5, y, "centre") + dl(x, y - hr - 5, x, y + hr + 5, "centre"); }
  o += dl(cx - R - 8, cy, cx + R + 8, cy, "centre") + dl(cx, cy - R - 8, cx, cy + R + 8, "centre");
  return svgWrap("62 10 216 204", o, label || "A flange with a ring of holes");
}

/* ---------- money and percentages, written the way the lesson writes them ---------- */
function r2(x){ return Math.round(x*100)/100; }
function commas(s){ var p = String(s).split("."); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ","); return p.join("."); }
/* plain numbers: no floating point noise, commas from 10,000 up (as the deck writes 54,800 and 1,800) */
function nf(x){ var r = Math.round(x*10000)/10000, s = String(r); if (/e/.test(s)) s = r.toFixed(4); return Math.abs(r) >= 1000 ? commas(s) : s; }
function fmtMoney(v){ var neg = v < 0, r = Math.round(Math.abs(v)*100)/100, s = Math.abs(r - Math.round(r)) < 1e-9 ? String(Math.round(r)) : r.toFixed(2);
  return (neg ? "−" : "") + "£" + commas(s); }
function fPct(v){ var r = r2(v), s = Math.abs(r - Math.round(r)) < 1e-9 ? String(Math.round(r)) : r.toFixed(2).replace(/(\.\d)0$/, "$1"); return s + "%"; }

/* a text label that stays dark on an amber fill in every theme */
function tx(x, y, s, o){ o = o || {};
  return '<text class="a-t" x="'+x+'" y="'+y+'" text-anchor="'+(o.a||"middle")+'" style="font-size:'+(o.size||12)+'px'+(o.dark ? ';fill:#241802' : '')+(o.muted ? ';fill:var(--muted);font-weight:400' : '')+'">'+esc(s)+'</text>'; }

var GAPS = [1, 3, 7, 14];

var TRANSFER = "U31-";   /* this hub's own transfer-code prefix */

function recordLines(){
  var p = S.prog;

}
function record(){

  }).join("");

  screen(fullHeader() + '<div class="wrap">' +

    '<textarea class="copyline" id="block" readonly aria-label="All my results">'+esc(lines || "Nothing to copy yet.")+'</textarea>' +
    '<button class="btn ghost block" id="copyAll">'+icon("copy")+'Copy the block</button></div>' +
    '<div class="sec"><h2>Moving to another phone</h2></div>' +

    '<p class="foot">Clearing your browser data clears this record. Send your results first.</p></div>', {tab:"record"});
  $("#copyAll").onclick = function(){ copyText(lines, function(ok){ toast(ok ? "Copied. Paste it into the class chat." : "Select the text and copy it."); }); };
  $("#pack").onclick = function(){

    copyText(code, function(ok){ toast(ok ? "Transfer code copied." : "Could not copy. Try again."); });
  };
  $("#bring").onclick = function(){
    var v = $("#unpack").value.trim(), msg = $("#mUnpack");
    try {
      if (v.indexOf(TRANSFER) !== 0) throw 0;
      var d = JSON.parse(decodeURIComponent(escape(atob(v.slice(TRANSFER.length)))));
      if (!d.me || !d.prog) throw 0;
      var cur = S.prog, inc = Object.assign(freshProg(), d.prog);
      cur.xp = Math.max(cur.xp, inc.xp);
      Object.keys(inc.best).forEach(function(k){ if ((inc.best[k]||0) > (cur.best[k]||-1)) { cur.best[k] = inc.best[k]; if (inc.raw[k]) cur.raw[k] = inc.raw[k]; } });
      Object.keys(inc.plays).forEach(function(k){ cur.plays[k] = Math.max(cur.plays[k]||0, inc.plays[k]); });
      Object.keys(inc.last).forEach(function(k){ if (!cur.last[k] || inc.last[k] > cur.last[k]) cur.last[k] = inc.last[k]; });

      if (cur.goal == null) cur.goal = inc.goal;
      inc.days.forEach(function(x){ if (cur.days.indexOf(x) < 0) cur.days.push(x); });
      saveProg(); toast("Record brought across."); record();
    } catch(e) { msg.style.color = "var(--red)"; msg.textContent = "That does not look like a transfer code. Copy it again on the other phone."; }
  };
}

function startGame(key){

  if (m) return ({last:runLast, dump:runDump, boss:runBoss})[m[1]](+m[2]);
  var g = gameByKey(key); if (g && g.parts) return openPartPicker(key);
  var run = {recall:runRecall, projection:runProjection, order:runOrder, choose:runChoose, swipe:runSwipe, symbols:runSymbols,
    scale:runScale, lines:runNameParts, abbr:runAbbr, notes:runNotes, featsort:runFeatSort, ladder:runLadder, term:runTerm,
    taboo:runTaboo, why:runWhy, errors:runErrors, examiner:runExaminer, flash:runFlash, review:runReview}[key];
  if (run) run();
}
document.addEventListener("keydown", function(e){
  var t = e.target, tag = (t && t.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-9]$/.test(e.key)) {
    var conf = $$(".conf button:not([disabled])");   /* Sure or Not?: once an answer is picked, the keys rate confidence */
    var b = (conf.length ? conf : $$(".opt:not([disabled]), .chunk:not([disabled]), [data-ans]:not([disabled])"))[Number(e.key)-1];
    if (b) { e.preventDefault(); b.click(); }

  $$("[data-edit]").forEach(function(b){ b.onclick = function(){ var t = $("#"+b.dataset.edit); if (t) { t.focus(); try { t.setSelectionRange(t.value.length, t.value.length); } catch(e){} } }; });

function listen(btn, box){
  if (!box || box.disabled) return;

  var rec; try { rec = new SR(); } catch(e) { micUnavailable(btn.dataset.mic); return; }
  rec.lang = "en-GB"; rec.interimResults = true; rec.maxAlternatives = 1; rec.continuous = false;
  var base = box.value.trim() ? box.value.replace(/\s+$/, "") + " " : "", fin = "";

  var lbl = $("span", btn); btn.classList.add("on"); if (lbl) lbl.textContent = "Listening. Tap to stop";

/* ---------- one engine for every retrieval game: typed, spoken, explain, and picked at cue level 1 ----------
   opts: conf (Sure or Not? before marking), master (a miss returns two questions later), hideTags (Last lesson),
         label, finishKey                                                                                  */
function runRetrieval(key, items, opts){
  opts = opts || {};
  var idsSeen = {}; items = items.map(function(it, k){ if (idsSeen[it.id]) it = Object.assign({}, it, {id: it.id + "~" + k}); idsSeen[it.id] = 1; return it; });
  var queue = items.slice(), total = items.length, score = 0, log = [], review = [], started = Date.now(), seen = {}, answered = 0, added = 0;
  var conf = {sr:0, sw:0, gr:0, gw:0}, cnt = {typed:0, spoken:0, self:0};
  function show(){
    var it = queue[0], again = !!seen[it.id], n = answered + queue.length, isMcq = it.k === "mcq";
    var tags = (it.a && !opts.hideTags ? '<span class="tag sl">Lesson slide '+it.a+'</span>' : '') + (it.levelName ? '<span class="tag">'+esc(it.levelName)+'</span>' : '');
    screen(gameHeader(TITLE[key], answered, n) + '<div class="wrap"><div class="card">' +
      '<div class="qno">'+(again ? "Back again" : (opts.label || "Question")+' '+(Object.keys(seen).length+1))+'</div>' +
      (tags ? '<div class="tags">'+tags+'</div>' : '') +
      (it.lead ? '<p class="qprompt" style="margin:4px 0 0">'+esc(it.lead)+'</p>' : '') +
      '<p class="qtext">'+esc(it.q)+'</p>' + (it.art ? '<div class="qart">'+it.art+'</div>' : '') +
      (it.cue ? cueHtml(it.cue) : '') +
      (isMcq ? '<div class="opts">'+optButtons(it.options)+'</div>' : answerBox(it.k, placeholderFor(it)) + '<button class="link" id="idk">I do not know yet</button>') +
      '<div id="confbox"></div><div id="fb" role="status"></div></div><div class="dock" id="dock">' +
      (isMcq ? '' : '<button class="btn amber block" id="chk">Check</button>') + '</div></div>', {game:true});
    if (isMcq) {
      $$(".opt").forEach(function(b){ b.onclick = function(){ var k = +b.dataset.k;
        if (!opts.conf) return pickMcq(it, k, null);
        $$(".opt").forEach(function(x){ x.classList.toggle("picked", x === b); });
        askConf(function(c){ pickMcq(it, k, c); }); }; });
      return;
    }
    var inp = $("#ans"); wireMics();
    inp.addEventListener("keydown", function(e){ if (e.key === "Enter" && it.k !== "explain") { e.preventDefault(); var b = $("#chk") || $("#next"); if (b) b.click(); } });
    $("#idk").onclick = function(){ commit(it, true, null); };
    $("#chk").onclick = function(){
      if (!norm(inp.value)) { var f = $("#fb"); f.className = "fb info"; f.innerHTML = "<strong>Type or say your answer first.</strong>Not sure? Tap I do not know yet and the answer will show."; return; }
      if (opts.conf) { stopListening(); inp.disabled = true; hideMic("ans"); $("#chk").disabled = true; askConf(function(c){ commit(it, false, c); }); }
      else commit(it, false, null);
    };
    setTimeout(function(){ try { inp.focus({preventScroll:true}); } catch(e) {} }, 60);
  }
  function askConf(done){
    $("#confbox").innerHTML = '<p class="qprompt" style="margin:14px 0 8px"><b style="color:var(--head)">How sure are you?</b></p>' +
      '<div class="rag conf"><button class="g" data-c="sure">Sure</button><button class="a" data-c="think">Think so</button><button class="r" data-c="guess">Guessing</button></div>';
    $$("[data-c]").forEach(function(c){ c.onclick = function(){ $$("[data-c]").forEach(function(x){ x.disabled = true; x.setAttribute("aria-pressed", String(x === c)); }); done(c.dataset.c); }; });
    try { $("#confbox").scrollIntoView({block:"nearest", behavior:"smooth"}); } catch(e) {}
  }
  function pickMcq(it, k, c){
    var ok = markOpts(it.correct, k), chosenFb = (!ok && it.wf) ? it.wf[it.options[k]] : "";
    record(it, ok, c, false, false);
    var fb = $("#fb"); fb.className = "fb" + (ok ? "" : " bad");
    fb.innerHTML = '<strong>'+(ok ? pick(["Right.","Yes, that is it.","Correct."]) : "Not this time.")+'</strong>' + (ok ? "" : "The answer is: "+esc(answerText(it))+". ") +
      (chosenFb ? '<span class="whyno"><b>About your answer:</b> '+esc(chosenFb)+'</span>' : '') + esc(it.why||"") + anchorNote(it);
    nextBtn(ok);
  }
  function anchorNote(it){ return it.a ? '<span class="small muted" style="display:block;margin-top:6px">From lesson slide '+it.a+'.</span>' : ''; }
  function commit(it, idk, c){
    stopListening(); var inp = $("#ans"), spoken = inp.dataset.spoken === "1"; inp.disabled = true; hideMic("ans");
    var b0 = $("#chk"); if (b0) b0.remove(); var ik = $("#idk"); if (ik) ik.remove();
    var fb = $("#fb");
    if (it.k === "explain") {
      if (idk || !norm(inp.value)) { record(it, false, c, spoken, false);
        fb.className = "fb bad"; fb.innerHTML = '<strong>Here is what a full answer says.</strong>' + ideasHtml(it, it.ideas.map(function(){ return false; })) + anchorNote(it); return nextBtn(false); }
      var found = ideasFound(inp.value, it.ideas), nf = found.filter(Boolean).length, sug = nf >= (it.need || it.ideas.length) ? "got" : (nf ? "part" : "miss");
      fb.className = "fb info"; fb.innerHTML = '<strong>You mentioned '+nf+' of the '+it.ideas.length+' key ideas the hub looks for.</strong>' + ideasHtml(it, found) + anchorNote(it) + selfMarkHtml(sug, true);
      $$("[data-sm]").forEach(function(b){ b.onclick = function(){ var ok = b.dataset.sm === "got"; $$("[data-sm]").forEach(function(x){ x.disabled = true; x.setAttribute("aria-pressed", String(x === b)); });
        record(it, ok, c, spoken, true); fb.className = "fb" + (ok ? "" : " bad"); nextBtn(ok); }; });
      try { fb.scrollIntoView({block:"nearest", behavior:"smooth"}); } catch(e) {}
      return;
    }
    var r = idk ? {res:"blank"} : markAny(it, inp.value);
    if (r.res === "check") {
      fb.className = "fb info"; fb.innerHTML = '<strong>Check it yourself.</strong>The hub cannot be sure about that wording. The answer is: <b>'+esc(answerText(it))+'</b>. '+esc(it.why||"") + anchorNote(it) + selfMarkHtml("", false);
      $$("[data-sm]").forEach(function(b){ b.onclick = function(){ var ok = b.dataset.sm === "got"; $$("[data-sm]").forEach(function(x){ x.disabled = true; x.setAttribute("aria-pressed", String(x === b)); });
        record(it, ok, c, spoken, true); fb.className = "fb" + (ok ? "" : " bad"); nextBtn(ok); }; });
      return;
    }
    var ok = r.res === "right" || r.res === "near" || r.res === "nounit" || r.res === "noratio", right = answerText(it), extra = "";
    if (r.res === "near") extra = "Nearly: check your spelling. It is " + cap1(r.fix) + ". ";
    if (r.res === "nounit") extra = "Add the unit next time: " + right + ". ";
    if (r.res === "noratio") extra = "Write it as a ratio next time: " + right + ". ";
    if (r.res === "unit") extra = r.none ? "Right number, but this one has no units. " : "You have the right number but the wrong unit. ";
    if (r.res === "upside") extra = "That is upside down: the drawing size comes first. ";
    if (r.rival) extra = "That is a different key word. ";
    if (r.res === "blank") extra = idk ? "No problem. Knowing what you do not know yet is useful. " : "";
    record(it, ok, c, spoken, false);
    fb.className = "fb" + (ok ? "" : " bad");
    fb.innerHTML = '<strong>'+(ok ? (r.res === "right" ? pick(["Right.","Yes, that is it.","Correct."]) : "Counted as right.") : "Not this time.")+'</strong>' +
      (ok ? "" : "The answer is: <b>"+esc(right)+"</b>. ") + esc(extra) + esc(it.why||"") + anchorNote(it);
    nextBtn(ok);
  }
  function record(it, ok, c, spoken, self){
    var first = !seen[it.id]; seen[it.id] = (seen[it.id]||0) + 1; answered++;
    if (first) {

      if (c) { var sure = c === "sure"; conf[(sure ? "s" : "g") + (ok ? "r" : "w")]++; }

      var back = it.kw ? termItem(it.kw, Math.max((it.lvl||2) - 1, 1)) : it;
      queue.splice(Math.min(2, queue.length), 0, Object.assign({}, back, {id:it.id, kw:it.kw}));
    }
  }
  function nextBtn(ok){
    var last = queue.length === 0;
    $("#dock").innerHTML = '<button class="btn amber block" id="next">'+(last ? "See my score" : (opts.master && !ok ? "Next (this one will come back)" : "Next"))+'</button>';

}

/* ---------- Sort It: tap a card, tap its group, then check the whole sort ---------- */

    var it = sets[i], order = shuffle(it.cards.map(function(_, k){ return k; })), place = {}, sel = null, checked = false;
    function draw(keep){
      var pool = order.filter(function(k){ return place[k] == null; });
      screen(gameHeader(TITLE[key], i, sets.length) + '<div class="wrap"><div class="card">' +
        '<div class="qno">Set '+(i+1)+' of '+sets.length+'</div>' + tagSlide(it.a) + '<p class="qtext">'+esc(it.title)+'</p>' +
        (checked ? '' : '<p class="qprompt">Tap a card, then tap the group it belongs in. Tap a placed card to send it back.</p>') +
        '<div class="pool">' + (pool.length ? pool.map(function(k){ return '<button class="chip2'+(sel === k ? ' sel' : '')+'" data-card="'+k+'" aria-pressed="'+(sel === k)+'">'+esc(it.cards[k][0])+'</button>'; }).join("") : (checked ? '' : '<span class="small muted">All placed. Check your sort.</span>')) + '</div>' +
        '<div class="bins'+(it.grid ? ' grid2' : '')+'">' + it.bins.map(function(b, bi){

            inb.map(function(k){ var ok = fits(it.cards[k], b);
              return '<button class="placed'+(checked ? (ok ? ' ok' : ' no') : '')+'" data-p="'+k+'"'+(checked ? ' disabled' : '')+'>'+esc(it.cards[k][0]) +
                (checked && !ok ? '<span class="small" style="display:block">Belongs in: '+esc(groupsOf(it.cards[k]))+'</span>' : '')+'</button>'; }).join("") + '</div>'; }).join("") + '</div>' +

      $$("[data-b]").forEach(function(b){ b.onclick = function(){ if (sel == null) { toast("Tap a card first, then its group."); return; } place[sel] = +b.dataset.b; sel = null; draw(true); }; });

        $("#next").onclick = function(){ if (last) finishGame(key, score, max, log, started, review); else { i++; show(); } };
        try { fb.scrollIntoView({block:"nearest", behavior:"smooth"}); } catch(e) {}
      } else {

        $("#chk").onclick = function(){

          order.forEach(function(k){ var ok = fits(it.cards[k], it.bins[place[k]]); if (ok) score++; else review.push({q:it.title + ": " + it.cards[k][0], right:groupsOf(it.cards[k]), why:""});

/* a card can belong in more than one group (a supplier waiting to be paid is also a creditor) */
function fits(card, bin){ return Array.isArray(card[1]) ? card[1].indexOf(bin) >= 0 : card[1] === bin; }
function groupsOf(card){ return Array.isArray(card[1]) ? card[1].join(" or ") : card[1]; }
function firstAndTwo(sets){ return [sets[0]].concat(shuffle(sets.slice(1)).slice(0, 2)); }

/* ---------- typed calculations: number and unit, two goes, worked solution after (Explaining) ----------

function runCalc(key, items, opts){
  opts = opts || {};

    if (i >= items.length) return finishGame(key, score, items.length, log, started, review, {det:"Typed right " + cnt.typed + ", spoken right " + cnt.spoken + ", self-marked 0"});

    if (fade === "part") scaffold = '<div class="worked"><b>Part worked.</b> The method is started for you. Finish the last step.<ol>'+it.work.slice(0, -1).map(function(w){ return '<li>'+esc(w)+'</li>'; }).join("")+'<li>Your turn.</li></ol></div>';
    screen(gameHeader(TITLE[key], i, items.length) + '<div class="wrap"><div class="card">' +
      (opts.fade ? '<div class="rungs" aria-hidden="true">' + items.map(function(_, k){ return '<i class="'+(k < i ? (log[k] && log[k].ok ? "done" : "miss") : (k === i ? "now" : ""))+'"></i>'; }).join("") + '</div>' : '') +
      '<div class="qno">'+(opts.fade ? 'Rung '+(i+1)+', '+it.lvl.toLowerCase()+(fade === "none" ? ", on your own" : "") : 'Question '+(i+1)+' of '+items.length)+'</div>' + tagSlide(it.a) + scaffold +
      '<p class="qtext">'+esc(it.q)+'</p>' + (it.art ? '<div class="qart">'+it.art+'</div>' : '') +
      answerBox("short", it.ph || (it.ratio ? "Write it as a ratio, for example 2:1" : (it.unit ? "Number and unit" : "Type the number (no units)"))) +
      '<div class="row" style="margin-top:4px"><button class="link" data-act="formula">Formula card</button></div>' +
      '<div id="hintbox"></div><div id="fb" role="status"></div></div>' +
      '<div class="dock" id="dock"><button class="btn amber block" id="chk">Check</button></div></div>', {game:true});
    var inp = $("#ans"); wireMics();
    inp.addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); var b = $("#chk") || $("#next"); if (b) b.click(); } });
    var right = it.ratio ? fmtRatio(it.v) : (it.money ? fmtMoney(it.v) : unitStr(it.v, it.unit));

      var spoken = inp.dataset.spoken === "1";

      log.push({i:it.id, ok:ok?1:0, l:it.q.slice(0, 90)});

        '<ol>'+it.work.map(function(w){ return '<li>'+esc(w)+'</li>'; }).join("")+'</ol>';
      $("#dock").innerHTML = '<button class="btn amber block" id="next">'+(i+1 < items.length ? (opts.fade ? "Next rung" : "Next") : "See my score")+'</button>';

    $("#chk").onclick = function(){

      if (r.res === "blank") { var f = $("#fb"); f.className = "fb info"; f.innerHTML = "<strong>Type or say your answer first.</strong>"; return; }
      tries++;

      if (r.res === "noratio") return done(true, "Write it as a ratio next time: " + right + ". ");
      var why = r.res === "unit" ? (r.none ? "Right number, but this one has no units. " : "Right number, wrong unit. ") : r.res === "upside" ? "That is upside down: the drawing size comes first. " : "";
      if (tries === 1) {
        if (guided()) $("#hintbox").innerHTML = '<div class="worked"><b>Hint.</b> '+esc(it.hint)+'</div>';
        var f2 = $("#fb"); f2.className = "fb info"; f2.innerHTML = "<strong>Not quite. Have one more go.</strong>" + esc(why) + (guided() ? "The hint is showing above." : "Check your units and each step.");

      } else done(false, why);
    };
    setTimeout(function(){ try { inp.focus({preventScroll:true}); } catch(e) {} }, 60);
  }
  show();
}

    function li(ok, good, bad){ return '<li>'+(ok ? '<b style="color:var(--green)">Right:</b> '+good : '<b style="color:var(--red)">Check this:</b> '+bad)+'</li>'; }
    var body = '<p style="margin:0">Thank you. Your tutor will see your score before the next lesson.</p><ul class="review">' +
      li(ok1, esc(E.q1.good.replace("%s", nf1)), "question 1 covered "+nf1+" of the 3 key ideas. A full answer: "+esc(E.q1.model)) +
      keys.slice(1).map(function(k, j){ return li(oks[j+1], esc(E[k].good), E[k].bad); }).join("") + '</ul>' +
      '<div class="panel amber"><p><b>Your first thing to work on:</b> '+esc(lowest)+'</p><p class="small" style="margin:0">It is now set as your goal on the home page, with the games that practise it.</p></div>';
    var detail = "Lines: " + rag + " | Typed right " + typedRight + " of 3 | Key ideas in Q1: " + nf1 + " of 3";
    doneScreen("exit", TITLE.exit, score, 6, "Handed in", body, detail);
  };
}

function runCheckin(part, key){
  var C = CONTENT.checkin[part], R = CONTENT.checkinRecall[part];
  screen(gameHeader(C.title, 0, 0) + '<div class="wrap"><div class="card"><p style="margin:0">First, two questions from memory. Then rate each line honestly. It tells your tutor what to go over again.</p>' +
    R.map(function(x, k){ var id = "cr"+k; return '<div class="q"><label for="'+id+'">'+(k+1)+'. '+esc(x.q)+(x.k === "num" ? ' <span class="small muted" style="font-weight:400">'+(x.money ? '(the amount in pounds)' : '(number and unit)')+'</span>' : '')+'</label><input id="'+id+'" class="textin" autocomplete="off">'+micBlock(id)+'</div>'; }).join("") +
    '<h3 style="margin:22px 0 4px">Rate yourself</h3>' + ragBlock("c", C.lines) + '<p id="err" class="small" role="alert" style="color:var(--red)"></p></div>' +
    '<div class="dock"><button class="btn amber block" id="send2">Send my check-in</button></div></div>', {game:true});
  wireRag(); wireMics();
  $("#send2").onclick = function(){
    stopListening();
    var rag = readRag("c", C.lines.length), ans = R.map(function(_, k){ return $("#cr"+k).value; });
    if (ans.some(function(a){ return !a.trim(); }) || rag.indexOf("-") >= 0) { $("#err").textContent = "Have a go at both questions and rate every line first. A best guess is fine."; return; }
    var oks = R.map(function(x, k){ var r = markAny(x, ans[k]); return r.res === "right" || r.res === "near" || r.res === "nounit" || r.res === "noratio"; }), nr = oks.filter(Boolean).length;
    R.forEach(function(x, k){ srsMark(x.id, oks[k], !!x.a); });
    var g = rag.split("").filter(function(x){ return x === "G"; }).length;
    logEvent("checkin", C.title, {score:g, max:C.lines.length, extra:{rag:rag, part:part, recallRight:nr}});
    var weak = C.lines.filter(function(_,k){ return rag[k] !== "G"; });
    var body = '<ul class="review">' + R.map(function(x, k){ return '<li>'+(oks[k] ? '<b style="color:var(--green)">Right:</b> ' : '<b style="color:var(--red)">Check this:</b> ')+esc(x.q)+' The answer: <b>'+esc(answerText(x))+'</b>.</li>'; }).join("") + '</ul>' +
      '<p style="margin:0">You rated '+g+' of '+C.lines.length+' lines as got it.</p>' +
      (weak.length ? '<p style="margin:0">Go over these next:</p><ul class="review">'+weak.map(function(l){ return '<li>'+esc(l)+'</li>'; }).join("")+'</ul>' : '<p style="margin:0">Everything rated got it. Try the Boss round for this part to prove it.</p>');
    saveProg();
    doneScreen(key, C.title, g, C.lines.length, "Sent", body, "Lines: " + rag + " | Recall right: " + nr + " of 2");
  };
}

/* ---------- start ---------- */
(function init(){
  applyPrefs();
  var labels = {games:["games","Games"], record:["record","My record"], help:["help","Help"]};
  $$("#tabs button").forEach(function(b){ var l = labels[b.dataset.tab]; b.innerHTML = icon(l[0]) + '<span>'+l[1]+'</span>';
    b.onclick = function(){ if (b.dataset.tab === "games") home(); else if (b.dataset.tab === "record") record(); else help(); }; });
  if (!CONTENT) { $("#app").innerHTML = '<div class="wrap"><p>The question bank did not load. Ask your tutor for a fresh copy of this file.</p></div>'; return; }
  buildReg();
  var qc = ""; try { qc = (new URLSearchParams(location.search).get("c") || "").trim().toUpperCase(); } catch(e) {}
  if (/^[A-Z0-9]{4}$/.test(qc)) {
    try { history.replaceState(null, "", location.pathname + location.hash); } catch(e) {}
    if (!S.me || S.me.code !== qc) {
      var hit = CLASS.filter(function(c){ return c.code === qc; })[0];
      S.me = {code:qc, name: hit ? hit.name : qc}; Store.set("me", S.me); try { localStorage.setItem("tlhub.me", JSON.stringify(S.me)); } catch(e) {} logEvent("open","hub");
    }
  }
  if (S.me) { loadProg(); home(); loadServer().then(function(){ if (!inGame && S.tab === "games" && S.me) home(); }); Sync.flush(); }
  else { loadServer().then(function(){ signIn(); }); signIn(); }
})();

</script>
